<html lang="en">

<style>
*{box-sizing:border-box;margin:0;padding:0}html{-webkit-text-size-adjust:100%}
:root{--navy:#1a1035;--teal:#07b4c5;--teal2:#059aaa;--green:#15803d;--red:#dc2626;--amber:#b45309;--border:#e5e7eb;--text:#111827;--muted:#6b7280}
body{background:#f0f2f5;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;font-size:14px;color:var(--text);min-height:100vh}
.login-screen{display:none;position:fixed;inset:0;z-index:10000;background:var(--navy);flex-direction:column;align-items:center;justify-content:center;padding:30px}
.login-screen.active{display:flex}
.login-card{background:#fff;border-radius:16px;padding:24px;width:100%;max-width:340px}
.login-input{width:100%;font-size:14px;background:#f9fafb;border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:10px;font-family:inherit}
.login-btn{width:100%;background:var(--teal);color:#fff;border:none;border-radius:8px;padding:11px;font-size:14px;font-weight:600;cursor:pointer}
.login-error{font-size:12px;color:var(--red);margin-top:8px;text-align:center;min-height:18px}
.wrap{display:none;max-width:980px;margin:0 auto;padding:0 0 60px}
header.topbar{background:var(--navy);padding:12px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:10;flex-wrap:wrap}
.topbar a{color:#8a9bb5;font-size:12px;text-decoration:none}
.topbar-title{color:#fff;font-size:16px;font-weight:700;flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:#fff;color:var(--text);border-radius:8px;padding:8px 12px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap}
.btn:hover{border-color:var(--teal)}
.btn-primary{background:var(--teal);border-color:var(--teal);color:#fff}
.btn-green{background:var(--green);border-color:var(--green);color:#fff}
.btn-danger{color:var(--red)}
.btn:disabled{opacity:.5;cursor:default}
.content{padding:14px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs button{border:1px solid var(--border);background:#fff;border-radius:99px;padding:6px 14px;font-size:13px;cursor:pointer;font-family:inherit}
.tabs button.on{background:var(--teal);border-color:var(--teal);color:#fff}
.tabs .n{background:var(--red);color:#fff;border-radius:99px;font-size:11px;padding:0 6px;margin-left:4px}
.card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.item{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.item:hover{border-color:var(--teal)}
.item .main{flex:1;min-width:0}
.item .t{font-weight:700}
.item .m{font-size:12px;color:var(--muted);margin-top:2px}
.amt{font-weight:700;white-space:nowrap}
.badge{font-size:11px;font-weight:700;border-radius:99px;padding:2px 8px;white-space:nowrap}
.b-draft{background:#f3f4f6;color:#374151}.b-sent{background:#dbeafe;color:#1d4ed8}.b-paid{background:#dcfce7;color:var(--green)}.b-void{background:#f3f4f6;color:#9ca3af;text-decoration:line-through}.b-over{background:#fee2e2;color:var(--red)}.b-new{background:#fef3c7;color:var(--amber)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:640px){.grid2{grid-template-columns:1fr}}
label.f{display:block;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;margin-bottom:3px}
.in{width:100%;font-size:14px;font-family:inherit;background:#f9fafb;border:1px solid var(--border);border-radius:8px;padding:8px 9px}
.in:focus{outline:none;border-color:var(--teal)}
textarea.in{min-height:56px;resize:vertical}
table.lines{width:100%;border-collapse:collapse;margin-top:6px}
table.lines th{font-size:11px;color:var(--muted);text-align:left;padding:4px;border-bottom:1px solid var(--border)}
table.lines td{padding:4px;vertical-align:top}
table.lines .num{width:90px;text-align:right}
.tot{text-align:right;font-size:14px;margin-top:8px;line-height:1.6}
.msg{font-size:13px;margin-top:8px}.err{color:var(--red)}.ok{color:var(--green)}
.empty{text-align:center;color:var(--muted);padding:26px}
.overlay{display:none;position:fixed;inset:0;background:rgba(17,24,39,.55);z-index:500;overflow:auto;padding:20px 10px}
.overlay.show{display:block}
.overlay .box{background:#fff;border-radius:12px;max-width:860px;margin:0 auto;padding:14px}
@media print{body *{visibility:hidden}#printArea,#printArea *{visibility:visible}#printArea{position:absolute;left:0;top:0}@page{size:A4;margin:0}.inv-page{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style>

<script>
// invoices.html v1.0.0 — 2026-11-23: tax invoices made in the app instead of Xero (numbers carry on from Xero, INV-1175).
// Customer invoice requests (from invoice_request.html) → make an invoice from a booking/package (deposit $35 per game,
// or the full amount less deposits) → email it (with a view / print / PDF link) → mark paid, which also records the
// deposit or payment on the booking(s) so POS and Reports agree. Admin / manager only (enforced by the database).
const BUILD_VERSION='1.2.0'; // v1.2.0: big status banner on each invoice (NOT PAID YET / PART PAID / OVERDUE / PAID IN FULL / VOID); recording a payment is behind 'Record a payment received…' (no more green 'Paid' button that looked done); 'Edit invoice' on sent invoices (Save changes / Save & resend). Previous build: 1.1.0 — v1.1.0: new invoices start from the customer, then their booking / package (or other charges); must be linked to a customer; product lines; drafts reopen with their booking. Previous build: 1.0.0
const SB_URL='https://dcksohetvlonijtcbjwe.supabase.co';
const SB_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRja3NvaGV0dmxvbmlqdGNiandlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA4NTQ1NzgsImV4cCI6MjA5NjQzMDU3OH0.M_oDB2e0upZUYZijNmigsmXtcKaAFx8iF-nn5FZUkzk';
const SB_AUTH=`${SB_URL}/auth/v1`;
const DEPOSIT_PER_GAME=35, TERMS_DAYS=14;
const SITE_BASE=location.href.replace(/[^/]*$/,'');
let currentUser=null,tokenTimer=null;
const H=()=>({'Content-Type':'application/json','Authorization':`Bearer ${currentUser?.token||SB_ANON}`,'apikey':SB_ANON});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'$'+(Number(n)||0).toLocaleString('en-NZ',{minimumFractionDigits:2,maximumFractionDigits:2});
const nzToday=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'Pacific/Auckland'}).format(new Date());
const addDays=(d,n)=>{const x=new Date(d+'T12:00');x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)};
const fmtD=d=>d?new Date(String(d).slice(0,10)+'T12:00').toLocaleDateString('en-NZ',{day:'numeric',month:'short',year:'numeric'}):'';
const fmtT=t=>{if(!t)return'';const[h,m]=t.split(':').map(Number);return`${h%12||12}${m?':'+String(m).padStart(2,'0'):''}${h>=12?'pm':'am'}`};
async function api(path,opts={}){
  const r=await fetch(`${SB_URL}/rest/v1/${path}`,{...opts,headers:{...H(),'Prefer':'return=representation',...(opts.headers||{})}});
  const t=await r.text();let d=null;try{d=t?JSON.parse(t):null}catch(e){}
  if(!r.ok)throw new Error((d&&(d.message||d.hint))||t||('Error '+r.status));return d;
}
async function edge(action,params){
  const r=await fetch(`${SB_URL}/functions/v1/btb-admin`,{method:'POST',headers:H(),body:JSON.stringify({action,...params})});
  const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||('Error '+r.status));return d;
}

// ───────── LIST ─────────
let invoices=[],requests=[],tab='todo';
async function loadAll(){
  try{
    [invoices,requests]=await Promise.all([api('invoices?select=*&order=created_at.desc&limit=500'),api('invoice_requests?select=*&order=created_at.desc&limit=300')]);
  }catch(e){document.getElementById('list').innerHTML=`<div class="card err">Could not load invoices: ${esc(e.message)}. (Invoices are for admin / managers.)</div>`;return}
  render();
}
const isOverdue=i=>i.status==='sent'&&i.due_date&&i.due_date<nzToday();
function render(){
  const newReq=requests.filter(r=>r.status==='new');
  const unpaid=invoices.filter(i=>i.status==='sent');
  const tabs=[['todo','To do',newReq.length+invoices.filter(i=>i.status==='draft').length],['unpaid','Unpaid',unpaid.filter(isOverdue).length],['paid','Paid',0],['all','All',0]];
  document.getElementById('tabs').innerHTML=tabs.map(([k,l,n])=>`<button class="${tab===k?'on':''}" onclick="tab='${k}';render()">${l}${n?`<span class="n">${n}</span>`:''}</button>`).join('');
  const L=document.getElementById('list');let h='';
  if(tab==='todo'){
    h+=`<div style="font-weight:700;margin:4px 0 8px">Invoice requests</div>`+(newReq.length?newReq.map(reqHtml).join(''):'<div class="card empty">No new requests</div>');
    const drafts=invoices.filter(i=>i.status==='draft');
    h+=`<div style="font-weight:700;margin:16px 0 8px">Drafts (not sent yet)</div>`+(drafts.length?drafts.map(invHtml).join(''):'<div class="card empty">No drafts</div>');
  }else{
    const list=tab==='unpaid'?unpaid.sort((a,b)=>String(a.due_date).localeCompare(String(b.due_date))):tab==='paid'?invoices.filter(i=>i.status==='paid'):invoices;
    const due=unpaid.reduce((a,i)=>a+BtbInvoice.totals(i).due,0);
    if(tab==='unpaid')h+=`<div class="card"><b>${money(due)}</b> owing on ${unpaid.length} invoice${unpaid.length===1?'':'s'}${unpaid.filter(isOverdue).length?` · <span style="color:var(--red);font-weight:700">${unpaid.filter(isOverdue).length} overdue</span>`:''}</div>`;
    h+=list.length?list.map(invHtml).join(''):'<div class="card empty">Nothing here</div>';
  }
  L.innerHTML=h;
}
function reqHtml(r){
  const what={deposit:'deposit only',full_now:'full amount now',full_after:'full amount after the event'}[r.invoice_what]||'';
  return`<div class="item" onclick="fromRequest('${r.id}')"><span class="badge b-new">Request</span><div class="main"><div class="t">${esc(r.org_name)}</div>
    <div class="m">${esc(r.email||'')}${r.po_number?' · PO '+esc(r.po_number):''} · ${what} · ${fmtD(r.created_at)}${r.narration?' · '+esc(r.narration):''}</div></div>
    <button class="btn" onclick="event.stopPropagation();dismissRequest('${r.id}')" title="Not needed">✕</button><i class="ti ti-chevron-right"></i></div>`;
}
function invHtml(i){
  const t=BtbInvoice.totals(i),od=isOverdue(i);
  const b=i.status==='void'?'b-void':od?'b-over':'b-'+i.status;
  return`<div class="item" onclick="openInvoice('${i.id}')"><span class="badge ${b}">${od?'Overdue':i.status[0].toUpperCase()+i.status.slice(1)}</span>
    <div class="main"><div class="t">${esc(i.invoice_number)} · ${esc(i.bill_to)}</div><div class="m">${fmtD(i.issue_date)} · due ${fmtD(i.due_date)}${i.reference?' · '+esc(i.reference):''}${i.kind==='deposit'?' · deposit':''}</div></div>
    <div class="amt">${money(t.total)}${t.paid&&t.due>0?`<div class="m" style="text-align:right">${money(t.due)} due</div>`:''}</div></div>`;
}
async function dismissRequest(id){
  if(!confirm('Mark this request as not needed?'))return;
  try{await api(`invoice_requests?id=eq.${id}`,{method:'PATCH',body:JSON.stringify({status:'dismissed'})});await loadAll()}catch(e){alert('Not saved: '+e.message)}
}

// ───────── BUILD FROM BOOKING(S) ─────────
async function bookingsFor(bookingId){
  const b=(await api(`game_bookings?id=eq.${bookingId}&select=*,clients(first_name,last_name,email,phone,company)`))[0];
  if(!b)throw new Error('Booking not found');
  let members=[b];
  if(b.group_booking_id)members=await api(`game_bookings?group_booking_id=eq.${b.group_booking_id}&status=neq.cancelled&select=*,clients(first_name,last_name,email,phone,company)&order=slot_time`);
  return members;
}
const parseList=v=>{if(Array.isArray(v))return v;if(typeof v==='string'&&v.trim()){try{const p=JSON.parse(v);return Array.isArray(p)?p:[]}catch(e){return[]}}return[]};
function buildLines(members,kind){
  const lines=[],lessLines=[];let paidAlready=0;
  const dep=invoices.filter(i=>i.kind==='deposit'&&i.status!=='void'&&i.status!=='draft');
  for(const m of members){
    const when=m.play_location==='hire'?`hire, ${fmtD(m.booking_date)}`:`${fmtD(m.booking_date)} ${fmtT(m.slot_time)}`;
    if(kind==='deposit'){lines.push({description:`Deposit — ${m.game_name}, ${when}`,qty:1,unit_price:DEPOSIT_PER_GAME,amount:DEPOSIT_PER_GAME,booking_id:m.id});continue}
    const addons=parseList(m.addons),extras=parseList(m.hire_extras);
    const extraSum=addons.reduce((a,x)=>a+(Number(x.amount)||0),0)+extras.reduce((a,x)=>a+(Number(x.amount)||0),0)+(Number(m.gm_fee)||0)+(Number(m.travel_fee)||0);
    const price=Math.round(((Number(m.total_amount)||0)-extraSum)*100)/100;
    const pl=m.play_location==='hire'?'':` — ${m.players_booked} player${m.players_booked===1?'':'s'}`;
    lines.push({description:`${m.game_name}, ${when}${pl}`,qty:1,unit_price:price,amount:price,booking_id:m.id});
    for(const x of addons){const q=(String(x.label||'').match(/^(\d+)\s*×\s*(.+)$/));const qty=q?Number(q[1]):(x.qty||1);
      lines.push({description:q?q[2]:(x.label||'Extra'),qty,unit_price:Math.round((Number(x.amount)||0)/qty*100)/100,amount:Number(x.amount)||0,booking_id:m.id})}
    if(Number(m.gm_fee))lines.push({description:'Game master',qty:1,unit_price:Number(m.gm_fee),amount:Number(m.gm_fee),booking_id:m.id});
    if(Number(m.travel_fee))lines.push({description:'Travel',qty:1,unit_price:Number(m.travel_fee),amount:Number(m.travel_fee),booking_id:m.id});
    for(const x of extras)lines.push({description:x.label||'Extra',qty:1,unit_price:Number(x.amount)||0,amount:Number(x.amount)||0,booking_id:m.id});
    // Deposit already invoiced (its own tax invoice) → take it off as a line; paid some other way → shows as a payment
    const depInv=dep.find(i=>(i.booking_ids||[]).includes(m.id));
    if(depInv){const amt=(depInv.lines||[]).filter(l=>l.booking_id===m.id).reduce((a,l)=>a+(Number(l.amount)||0),0);
      if(amt)lessLines.push({description:`Less deposit — ${m.game_name} (${depInv.invoice_number})`,qty:1,unit_price:-amt,amount:-amt,booking_id:m.id})}
    else if(m.deposit_paid)paidAlready+=Number(m.deposit_amount)||0;
  }
  return{lines:[...lines,...lessLines],paidAlready};
}
function draftFrom(members,kind,req){
  const c=members[0].clients||{};
  const name=[c.first_name,c.last_name].filter(Boolean).join(' ');
  const {lines,paidAlready}=buildLines(members,kind);
  const issue=req?.invoice_what==='full_after'&&members[0].booking_date>nzToday()?members[0].booking_date:nzToday();
  return{kind,status:'draft',client_id:members[0].client_id,client_name:name||c.company||null,request_id:req?.id||null,booking_ids:members.map(m=>m.id),group_booking_id:members[0].group_booking_id||null,
    issue_date:issue,due_date:addDays(issue,TERMS_DAYS),bill_to:req?.org_name||c.company||name||'',contact_name:req?.contact_name||name||null,
    bill_email:req?.email||c.email||null,bill_phone:req?.phone||c.phone||null,bill_address:req?.billing_address||null,po_number:req?.po_number||null,
    reference:req?.narration||`${[...new Set(members.map(m=>m.game_name))].join(' + ')} — ${fmtD(members[0].booking_date)}`,
    lines,paid_amount:paidAlready,notes:req?.terms_note?`Customer asked for terms: ${req.terms_note}`:null};
}
async function fromRequest(id){
  const r=requests.find(x=>x.id===id);if(!r)return;
  try{const members=await bookingsFor(r.booking_id);openEditor(draftFrom(members,r.invoice_what==='deposit'?'deposit':'full',r),members,r)}
  catch(e){alert('Could not load the booking: '+e.message)}
}
async function fromBooking(bookingId,kind){
  try{const members=await bookingsFor(bookingId);openEditor(draftFrom(members,kind||'full',null),members,null)}
  catch(e){alert('Could not load the booking: '+e.message)}
}
// v1.1.0: a new invoice always starts from the customer, then one of their bookings / packages
// (or "other charges" for that customer). Lines can still be added or changed in the editor.
function newBlankInvoice(){pickCustomer()}
let attachMode=false,attachDraft=null;
function pickCustomer(attach){
  attachMode=!!attach;if(attach){collectEd();attachDraft={ed,edMembers,edReq}}
  document.getElementById('ovBox').innerHTML=`
    <div class="row" style="justify-content:space-between;margin-bottom:10px"><b style="font-size:16px">${attach?'Link this invoice to a customer':'New invoice — who is it for?'}</b><button class="btn" onclick="${attach?'backToDraft()':'closeOv()'}">${attach?'← Back':'✕ Close'}</button></div>
    <input class="in" id="cs_q" placeholder="Search name, company or email…" oninput="clearTimeout(window._cs);window._cs=setTimeout(searchCustomers,250)" autocomplete="off">
    <div id="cs_res" style="margin-top:10px"><div class="empty">Type at least 2 letters</div></div>`;
  document.getElementById('ov').classList.add('show');setTimeout(()=>document.getElementById('cs_q').focus(),50);
}
async function searchCustomers(){
  const q=document.getElementById('cs_q').value.trim().replace(/[,()*%\\]/g,' ').trim(),box=document.getElementById('cs_res');
  if(q.length<2){box.innerHTML='<div class="empty">Type at least 2 letters</div>';return}
  try{
    const e=encodeURIComponent(`*${q}*`);
    const rows=await api(`clients?or=(first_name.ilike.${e},last_name.ilike.${e},email.ilike.${e},company.ilike.${e})&select=id,first_name,last_name,email,phone,company&order=first_name&limit=25`);
    window._csRows=rows;

// ───────── SENT / PAID INVOICE ─────────
// v1.2.0: big clear status at the top of a sent invoice — NOT PAID YET / PART PAID / OVERDUE / PAID / VOID
function statusBanner(i,t){
  const box=(bg,bd,fg,html)=>`<div style="background:${bg};border:2px solid ${bd};color:${fg};border-radius:12px;padding:12px 14px;margin-bottom:10px;font-size:15px">${html}</div>`;
  if(i.status==='void')return box('#f3f4f6','#d1d5db','#6b7280','<b>VOID</b> — this invoice is cancelled and not owed.');
  if(t.due<=0)return box('#dcfce7','#86efac','#166534',`<b>✓ PAID IN FULL</b>${i.paid_at?' — '+fmtD(i.paid_at):''}`);
  const over=isOverdue(i);
  const what=t.paid>0?`<b>PART PAID</b> — ${money(t.paid)} received, <b>${money(t.due)} still owing</b>`:`<b>⏳ NOT PAID YET</b> — <b>${money(t.due)} owing</b>`;
  return over?box('#fee2e2','#fca5a5','#991b1b',`⚠ <b>OVERDUE</b> — ${money(t.due)} owing, was due ${fmtD(i.due_date)}`)
    :box('#fef3c7','#fcd34d','#92400e',`${what}, due ${fmtD(i.due_date)}`);
}

async function voidInv(id){if(!confirm('Void this invoice? It stays on record (numbers are never reused) but is no longer owed.'))return;
  try{await api(`invoices?id=eq.${id}`,{method:'PATCH',body:JSON.stringify({status:'void',updated_at:new Date().toISOString()})});closeOv();await loadAll()}catch(e){alert('Not saved: '+e.message)}}
// A payment on the invoice is also recorded on the booking(s): a deposit invoice marks each game's deposit paid;
// a full invoice adds a payment to each booking for its share — so POS, the calendar and Reports all agree.
async function recordPayment(id){
  const i=invoices.find(x=>x.id===id),m=document.getElementById('p_msg');
  const amt=Number(document.getElementById('p_amt').value),date=document.getElementById('p_date').value,method=document.getElementById('p_method').value,ref=document.getElementById('p_ref').value.trim()||i.invoice_number;
  if(!(amt>0)||!date){m.className='msg err';m.textContent='Enter the amount and the date it was received.';return}
  const t=BtbInvoice.totals(i);const at=new Date(date+'T12:00:00').toISOString();
  m.className='msg';m.textContent='Saving…';
  try{
    const newPaid=Math.round((t.paid+amt)*100)/100;
    await api(`invoices?id=eq.${id}`,{method:'PATCH',body:JSON.stringify({paid_amount:newPaid,paid_at:at,paid_method:method,paid_ref:ref,status:newPaid>=t.total?'paid':i.status,updated_at:new Date().toISOString()})});
    // share of this payment for each booking, in proportion to its lines on the invoice
    const byB={};(i.lines||[]).forEach(l=>{if(l.booking_id)byB[l.booking_id]=(byB[l.booking_id]||0)+(Number(l.amount)||0)});
    const lineTotal=Object.values(byB).reduce((a,v)=>a+v,0);
    for(const [bid,share] of Object.entries(byB)){
      if(share<=0||lineTotal<=0)continue;
      const part=Math.round(amt*share/lineTotal*100)/100;
      if(i.kind==='deposit'){
        await api(`game_bookings?id=eq.${bid}`,{method:'PATCH',body:JSON.stringify({deposit_paid:true,deposit_amount:part,deposit_method:method,deposit_paid_at:at,deposit_ref:`${i.invoice_number}${ref&&ref!==i.invoice_number?' · '+ref:''}`,deposit_recorded_by:currentUser?.name||null,updated_at:new Date().toISOString()})});
      }else{
        const b=(await api(`game_bookings?id=eq.${bid}&select=payments`))[0];
        let p=b?.payments;if(typeof p==='string'){try{p=JSON.parse(p)}catch(e){p=[]}}if(!Array.isArray(p))p=[];
        p.push({amount:part,method,at,ref:`${i.invoice_number}${ref&&ref!==i.invoice_number?' · '+ref:''}`});
        await api(`game_bookings?id=eq.${bid}`,{method:'PATCH',body:JSON.stringify({payments:JSON.stringify(p),updated_at:new Date().toISOString()})});
      }
    }
    m.className='msg ok';m.textContent='✓ Payment recorded';await loadAll();openDetail(invoices.find(x=>x.id===id));
  }catch(e){m.className='msg err';m.textContent='Not saved: '+e.message}
}
function printOrShow(inv,print){
  if(print){document.getElementById('printArea').innerHTML=BtbInvoice.render(inv);setTimeout(()=>window.print(),300);return}
  const w=window.open('','_blank');w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>${esc(inv.invoice_number)}</title><base href="${SITE_BASE}"><style>body{margin:0;background:#e5e7eb}@media print{body{background:#fff}@page{size:A4;margin:0}}</style></head><body>${BtbInvoice.render(inv)}</body></html>`);w.document.close();
}
function closeOv(){document.getElementById('ov').classList.remove('show');ed=null}

// ───────── LOGIN (same shared session as the other staff pages) ─────────
function scheduleRefresh(){clearTimeout(tokenTimer);if(!currentUser?.expiresAt)return;tokenTimer=setTimeout(refreshToken,Math.max(5000,currentUser.expiresAt-Date.now()-120000))}
async function refreshToken(){
  if(!currentUser?.refreshToken)return;
  try{const r=await fetch(`${SB_AUTH}/token?grant_type=refresh_token`,{method:'POST',headers:{'Content-Type':'application/json','apikey':SB_ANON},body:JSON.stringify({refresh_token:currentUser.refreshToken})});
    const d=await r.json();if(!r.ok||!d.access_token)throw new Error(d.error_description||'Refresh failed');
    currentUser.token=d.access_token;currentUser.refreshToken=d.refresh_token||currentUser.refreshToken;currentUser.expiresAt=Date.now()+(d.expires_in||3600)*1000;
    localStorage.setItem('btb_staff_session',JSON.stringify(currentUser));scheduleRefresh()}
  catch(e){console.error('Token refresh failed — signing out:',e);doLogout()}
}
async function doLogin(){
  let email=document.getElementById('loginEmail').value.trim().toLowerCase();if(email&&!email.includes('@'))email+='@btbescaperooms.co.nz';
  const pass=document.getElementById('loginPass').value,err=document.getElementById('loginError');err.textContent='';
  try{const r=await fetch(`${SB_AUTH}/token?grant_type=password`,{method:'POST',headers:{'Content-Type':'application/json','apikey':SB_ANON},body:JSON.stringify({email,password:pass})});
    const d=await r.json();if(!r.ok){err.textContent=d.error_description||'Login failed.';return}
    currentUser={id:d.user.id,email,token:d.access_token,refreshToken:d.refresh_token,expiresAt:Date.now()+(d.expires_in||3600)*1000};
    const role=await edge('get_my_role',{}).catch(()=>null);if(role){currentUser.name=role.name;currentUser.role=role.role}
    localStorage.setItem('btb_staff_session',JSON.stringify(currentUser));start()}
  catch(e){err.textContent='Connection error.'}
}
function doLogout(){clearTimeout(tokenTimer);currentUser=null;localStorage.removeItem('btb_staff_session');document.getElementById('appWrap').style.display='none';document.getElementById('loginScreen').classList.add('active')}
async function start(){
  document.getElementById('loginScreen').classList.remove('active');document.getElementById('appWrap').style.display='block';
  document.getElementById('ver').textContent='v'+BUILD_VERSION;scheduleRefresh();
  await loadAll();
  // invoices.html?booking=<id>&kind=deposit|full  (from BtB App / POS)   invoices.html?request=<id>
  const qp=new URLSearchParams(location.search);
  if(qp.get('booking'))fromBooking(qp.get('booking'),qp.get('kind'));
  else if(qp.get('request'))fromRequest(qp.get('request'));
  else if(qp.get('id'))openInvoice(qp.get('id'));
  if([...qp.keys()].length)history.replaceState(null,'',location.pathname);
}
window.addEventListener('DOMContentLoaded',async()=>{
  const s=localStorage.getItem('btb_staff_session');if(!s)return;
  try{currentUser=JSON.parse(s);if(!currentUser.refreshToken){doLogout();return}
    if((currentUser.expiresAt||0)-Date.now()<300000){await refreshToken();if(!currentUser)return}
    start()}catch(e){doLogout()}
});
