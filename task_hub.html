<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beyond the Box — Task Hub</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#07b4c5">
<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(function(e){console.error('SW registration failed:',e);});}</script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
:root{
  --navy:#1a1035;--teal:#07b4c5;--teal2:#059aaa;--green:#1d9e75;
  --amber:#ef9f27;--red:#dc2626;--purple:#7c3aed;
  --bg:#f0f2f5;--card:#fff;--border:#e5e7eb;
  --text:#111827;--muted:#6b7280;--light:#f9fafb;
}
body{background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;font-size:14px;color:var(--text);min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}

/* LOGIN */
.login-screen{display:none;position:fixed;inset:0;z-index:10000;background:var(--navy);flex-direction:column;align-items:center;justify-content:center;padding:30px}
.login-screen.active{display:flex}
.login-logo{font-size:22px;font-weight:800;color:var(--teal);margin-bottom:6px;display:flex;align-items:center;gap:8px}
.login-sub{font-size:13px;color:#8a9bb5;margin-bottom:32px}
.login-card{background:#fff;border-radius:14px;padding:28px;width:100%;max-width:340px}
.login-title{font-size:16px;font-weight:700;color:#111827;margin-bottom:18px}
.login-field{margin-bottom:14px}
.login-label{font-size:11px;font-weight:600;color:#6b7280;text-transform:uppercase;letter-spacing:.4px;margin-bottom:5px}
.login-input{width:100%;font-size:14px;font-family:inherit;color:#374151;background:#f9fafb;border:1px solid #e5e7eb;border-radius:8px;padding:10px 12px}
.login-btn{width:100%;background:var(--teal);color:#fff;border:none;border-radius:8px;padding:11px;font-size:14px;font-weight:600;cursor:pointer;margin-top:6px;font-family:inherit}
.login-error{font-size:12px;color:#dc2626;margin-top:8px;text-align:center;min-height:18px}

/* SHELL */
.app-wrap{display:flex;min-height:100vh;min-height:100dvh;width:100%}
.sidebar{width:220px;background:var(--navy);color:#fff;flex-shrink:0;position:relative;transition:width .18s ease}
.sidebar.collapsed{width:0;overflow:hidden}
.sidebar-collapse-btn{position:absolute;top:18px;right:12px;width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.2);color:#a0b0c8;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;z-index:5}
.sidebar-edge-tab{display:none;position:fixed;top:18px;left:0;width:26px;height:26px;border-radius:0 50% 50% 0;background:var(--navy);border:1px solid rgba(255,255,255,.2);border-left:none;color:#a0b0c8;cursor:pointer;align-items:center;justify-content:center;font-size:14px;z-index:902}
.sidebar-edge-tab.show{display:flex}
.sidebar-logo{padding:20px 16px 14px}
.sidebar-brand{font-size:15px;font-weight:700;color:var(--teal);display:flex;align-items:center;gap:7px}
.sidebar-sub{font-size:11px;color:#8a9bb5;margin-top:3px}
.sidebar-user{padding:10px 16px;border-bottom:1px solid rgba(255,255,255,.08);font-size:12px;color:#8a9bb5;display:flex;justify-content:space-between;align-items:center}
.sidebar-logout{color:#8a9bb5;cursor:pointer;font-size:11px;text-decoration:underline}
.sidebar-back{display:flex;padding:8px 16px;font-size:12px;color:#8a9bb5;text-decoration:none;align-items:center;gap:5px;border-bottom:1px solid rgba(255,255,255,.08)}
.sidebar-section{padding:14px 16px 6px;font-size:10px;font-weight:700;color:#4b5563;text-transform:uppercase;letter-spacing:1px}
.nav-item{display:flex;align-items:center;gap:9px;padding:9px 16px;font-size:13px;color:#a0b0c8;cursor:pointer;border-left:3px solid transparent;transition:all .15s;text-decoration:none}
.nav-item:hover{background:rgba(255,255,255,.05);color:#fff}
.nav-item.active{background:rgba(7,180,197,.12);color:var(--teal);border-left-color:var(--teal);font-weight:600}
.nav-item i{font-size:16px;flex-shrink:0}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{background:#fff;border-bottom:1px solid var(--border);padding:14px 20px}
.topbar-title{font-size:18px;font-weight:700;color:var(--text)}
.content{padding:16px 20px 40px;flex:1;overflow-y:auto;max-width:900px;width:100%}
.card{background:var(--card);border-radius:12px;border:1px solid var(--border);padding:14px 16px;margin-bottom:12px}
.empty-state{text-align:center;padding:24px;color:var(--muted);font-size:13px}
.section-title{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:18px 0 8px;display:flex;align-items:center;gap:6px}
.pill-tabs{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.pill-tab{padding:6px 12px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;border:1px solid var(--border);border-radius:999px;background:#fff}
.pill-tab.active{color:#fff;background:var(--teal);border-color:var(--teal)}

/* FORMS */
.form-row{margin-bottom:10px}
.form-label{font-size:12px;font-weight:600;color:var(--muted);margin-bottom:4px;display:block}
.form-select,.form-input,.form-textarea{width:100%;font-size:14px;font-family:inherit;color:#374151;background:#f9fafb;border:1px solid var(--border);border-radius:8px;padding:8px 10px}
.form-textarea{min-height:60px;resize:vertical}
.row2{display:flex;gap:8px;flex-wrap:wrap}.row2>*{flex:1;min-width:140px}
.btn{font-size:13px;padding:8px 14px;border-radius:8px;border:none;cursor:pointer;font-family:inherit;font-weight:600;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn-primary{background:var(--teal);color:#fff}
.btn-green{background:var(--green);color:#fff}
.btn-secondary{background:#fff;border:1px solid var(--border);color:var(--text)}
.btn-danger{background:#fef2f2;color:var(--red);border:1px solid #fecaca}
.btn-sm{font-size:12px;padding:5px 10px}
.btn-big{font-size:15px;padding:12px 16px;width:100%}
.chk{display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer}
.msg{font-size:12px;margin-top:6px;min-height:16px}.msg.err{color:var(--red)}.msg.ok{color:var(--green)}
.badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px;display:inline-block;letter-spacing:.3px}
.b-red{background:#fee2e2;color:#b91c1c}.b-green{background:#dcfce7;color:#15803d}.b-amber{background:#fef3c7;color:#92400e}.b-grey{background:#f3f4f6;color:#6b7280}.b-teal{background:#e0f7fa;color:#0e7490}.b-purple{background:#ede9fe;color:#6d28d9}

/* ROOM BOARD */
.room-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.room-card{border-radius:12px;padding:12px 14px;border:2px solid var(--border);background:#fff}
.room-card.need{border-color:#dc2626;background:#fef2f2}
.room-card.need.urgent{animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(220,38,38,.35)}50%{box-shadow:0 0 0 8px rgba(220,38,38,0)}}
.room-card.ready{border-color:#86efac;background:#f0fdf4}
.room-name{font-size:15px;font-weight:700}
.room-status{font-size:13px;font-weight:700;margin-top:4px}
.room-sub{font-size:12px;color:var(--muted);margin-top:3px}
.room-btns{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}

/* JOB LIST */
.job{display:flex;align-items:center;gap:10px;padding:11px 12px;border:1px solid var(--border);border-radius:10px;margin-bottom:8px;background:#fff;cursor:pointer}
.job:hover{border-color:var(--teal)}
.job.overdue{border-color:#fca5a5;background:#fff7f7}
.job-icon{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;background:#e0f7fa;color:#0e7490}
.job-body{flex:1;min-width:0}
.job-name{font-weight:600;font-size:14px}
.job-meta{font-size:12px;color:var(--muted);margin-top:2px}

/* RUN SCREEN */
.overlay{display:none;position:fixed;inset:0;background:var(--bg);z-index:5000;overflow-y:auto}
.overlay.show{display:block}
.overlay-head{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;gap:10px;z-index:2}
.overlay-title{font-size:16px;font-weight:700;flex:1;min-width:0}
.overlay-body{padding:14px 16px 120px;max-width:720px;margin:0 auto}
.item{background:#fff;border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.item.child{margin-left:18px;border-left:3px solid var(--teal)}
.item.heading{background:transparent;border:none;padding:10px 2px 2px;font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.item-label{font-size:15px;font-weight:600}
.item-help{font-size:12px;color:var(--muted);margin-top:3px;white-space:pre-wrap}
.req{color:var(--red);margin-left:3px}
.tick-btn{display:flex;align-items:center;gap:10px;width:100%;background:none;border:none;font-family:inherit;text-align:left;cursor:pointer;padding:0}
.tick-box{width:30px;height:30px;border-radius:8px;border:2px solid #cbd5e1;display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff;flex-shrink:0}
.tick-box.on{background:var(--green);border-color:var(--green)}
.choice-row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.choice{flex:1;min-width:80px;padding:10px;border-radius:9px;border:2px solid var(--border);background:#fff;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit}
.choice.on-ok{border-color:var(--green);background:#dcfce7;color:#15803d}
.choice.on-bad{border-color:var(--red);background:#fee2e2;color:#b91c1c}
.choice.on{border-color:var(--teal);background:#e0f7fa;color:#0e7490}
.warn-line{font-size:12px;font-weight:700;color:var(--red);margin-top:6px}
.ref-photo{max-width:160px;max-height:120px;border-radius:8px;margin-top:8px;border:1px solid var(--border);cursor:pointer}
.photo-thumb{width:110px;height:110px;object-fit:cover;border-radius:8px;margin-top:8px;border:1px solid var(--border)}
.run-foot{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--border);padding:10px 16px;z-index:5001;display:none}
.run-foot.show{display:block}
.run-foot-inner{max-width:720px;margin:0 auto;display:flex;gap:8px}

/* EDITOR */
.ed-item{border:1px solid var(--border);border-radius:10px;padding:10px;margin-bottom:8px;background:#fff}
.ed-item.child{margin-left:22px;border-left:3px solid var(--teal);background:#fafeff}
.ed-tools{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.list-row{display:flex;align-items:center;gap:8px;padding:9px 12px;border:1px solid var(--border);border-radius:9px;margin-bottom:6px;background:#fff}
.list-row .grow{flex:1;min-width:0}
table.ans{width:100%;border-collapse:collapse;font-size:13px}
table.ans td{padding:7px 6px;border-top:1px solid var(--border);vertical-align:top}
@media (max-width:760px){
  .sidebar{display:none}
  .content{padding:12px 12px 40px}
}
</style>
</head>
<body>

<div class="login-screen active" id="loginScreen">
  <div class="login-logo"><i class="ti ti-box"></i> Beyond the Box</div>
  <div class="login-sub">Task Hub</div>
  <div class="login-card">
    <div class="login-title">Sign in</div>
    <div class="login-field"><div class="login-label">Username</div>
      <input class="login-input" type="text" id="loginEmail" placeholder="firstname" autocapitalize="off" autocorrect="off" onkeydown="if(event.key==='Enter')document.getElementById('loginPass').focus()">
    </div>
    <div class="login-field"><div class="login-label">Password</div>
      <input class="login-input" type="password" id="loginPass" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <button class="login-btn" onclick="doLogin()">Sign in</button>
    <div class="login-error" id="loginError"></div>
  </div>
</div>
<script>
  if(localStorage.getItem('btb_staff_session')){
    document.getElementById('loginScreen').classList.remove('active');
  }
</script>

<div class="app-wrap" id="appWrap" style="display:none">
  <button class="sidebar-edge-tab" id="sidebarEdgeTab" onclick="toggleSidebar()"><i class="ti ti-chevron-right"></i></button>

    <div class="sidebar-logo">
      <div class="sidebar-brand"><i class="ti ti-box"></i> Beyond the Box</div>
      <div class="sidebar-sub">Task Hub <span id="buildVersionTag" style="font-size:9px;font-weight:400;color:#8a9bb5;letter-spacing:0.5px;vertical-align:middle"></span></div>
    </div>
    <div class="sidebar-user">
      <span id="sidebarUser">—</span>
      <span class="sidebar-logout" onclick="doLogout()">Sign out</span>
    </div>
    <a class="sidebar-back" href="btb_app.html"><i class="ti ti-chevron-left"></i> BtB App</a>
    <div class="sidebar-section">Task Hub</div>
    <span class="nav-item" data-tab="today" onclick="switchTab('today')"><i class="ti ti-checklist"></i> Today</span>
    <span class="nav-item" data-tab="history" onclick="switchTab('history')"><i class="ti ti-history"></i> History</span>

  <div class="main">

      <div class="topbar-title" id="topbarTitle">Today</div>

      </div>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<!-- Full-screen checklist / detail view -->
<div class="overlay" id="overlay">
  <div class="overlay-head">
    <button class="btn btn-secondary btn-sm" onclick="closeOverlay()"><i class="ti ti-arrow-left"></i></button>
    <div class="overlay-title" id="overlayTitle"></div>
  </div>
  <div class="overlay-body" id="overlayBody"></div>
</div>
<div class="run-foot" id="runFoot"><div class="run-foot-inner" id="runFootInner"></div></div>

<script>
// BtB error logger v1.0.0 — sends uncaught errors to the Supabase error_logs table (see Settings > Errors).
(function(){
  var PAGE='task_hub.html', EP='https://dcksohetvlonijtcbjwe.supabase.co/rest/v1/error_logs', KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRja3NvaGV0dmxvbmlqdGNiandlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA4NTQ1NzgsImV4cCI6MjA5NjQzMDU3OH0.M_oDB2e0upZUYZijNmigsmXtcKaAFx8iF-nn5FZUkzk';
  var sent=0, seen={};
  function clip(v,n){v=(v==null?'':String(v));return v.length>n?v.slice(0,n):v;}
  function send(level,source,msg,stack,ctx){
    try{
      msg=clip(msg||'(no message)',2000);
      if(/ResizeObserver loop|^Script error\.?$/i.test(msg))return;
      var key=source+'|'+msg; if(seen[key]||sent>=20)return; seen[key]=1; sent++;
      var token=KEY;
      try{ if(typeof currentUser!=='undefined'&&currentUser&&currentUser.token)token=currentUser.token; }catch(e){}
      var ver=null; try{ if(typeof BUILD_VERSION!=='undefined')ver=clip(BUILD_VERSION,40); }catch(e){}
      var c={}; try{ c=ctx||{}; if(JSON.stringify(c).length>6000)c={note:'context too large'}; }catch(e){c={};}
      var body=JSON.stringify({level:level,source:clip(source,50),message:msg,stack:stack?clip(stack,8000):null,
        page:PAGE,url:clip(location.origin+location.pathname,500),context:c,user_agent:clip(navigator.userAgent,400),app_version:ver});
      var post=function(tok){
        return fetch(EP,{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY,'Authorization':'Bearer '+tok,'Prefer':'return=minimal'},body:body,keepalive:true})
          .then(function(r){ if(!r.ok&&tok!==KEY)return post(KEY); });
      };
      post(token).catch(function(){});
    }catch(e){}
  }
  window.addEventListener('error',function(e){
    try{
      var fn=e.filename||''; if(/^(chrome|moz|safari|webkit)-extension:/.test(fn))return;
      send('error','window.onerror',e.message,e.error&&e.error.stack,{file:fn.split('/').pop(),line:e.lineno,col:e.colno});
    }catch(x){}
  });
  window.addEventListener('unhandledrejection',function(e){
    try{ var r=e.reason; send('error','promise',(r&&r.message)||String(r),r&&r.stack); }catch(x){}
  });
  window.btbLogError=function(source,err,ctx,level){ send(level||'error',source,(err&&err.message)||String(err),err&&err.stack,ctx); };
})();
</script>
<script>
const BUILD_VERSION = '2.0.0'; // v2.0.0: Task Hub rebuilt (Phase 1). One kind of checklist for room reset / set-up / opening / closing / maintenance / owners / health & safety, with tick, OK/Not OK, dropdown, number (e.g. battery %), note and photo items, follow-up questions, a Quick reset (short list) for experienced GMs, and every completed checklist kept as a record. Today screen: room board (Needs reset / Ready), Today's jobs open to anyone, jobs assigned to you. History, Issues (raised from Not OK / maintenance needed / low battery answers, or reported directly), checklist editor and Areas settings. New tables cl_*; the old task tables are untouched.
// Previous build: 1.7.5 — // v1.7.5: The link back to the main app in the sidebar now says "BtB App" (was "Calendar"), the same as every other page.
console.log(`%cTask Hub — build v${BUILD_VERSION}`, 'color:#07b4c5;font-weight:bold;font-size:13px');

const SB_URL='https://dcksohetvlonijtcbjwe.supabase.co';
const SB_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRja3NvaGV0dmxvbmlqdGNiandlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA4NTQ1NzgsImV4cCI6MjA5NjQzMDU3OH0.M_oDB2e0upZUYZijNmigsmXtcKaAFx8iF-nn5FZUkzk';
const SB_AUTH=`${SB_URL}/auth/v1`;
const EDGE_FN=`${SB_URL}/functions/v1/btb-admin`;
const H=(k)=>{const token=k||(currentUser&&currentUser.token)||SB_ANON;return{'Content-Type':'application/json','Authorization':`Bearer ${token}`,'apikey':SB_ANON}};
async function callEdgeFunction(action,params={},token=null){
  const r=await fetch(EDGE_FN,{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${token||SB_ANON}`,'apikey':SB_ANON},body:JSON.stringify({action,...params})});
  if(!r.ok){const e=await r.json().catch(()=>({}));throw new Error(e.error||`Edge function error ${r.status}`)}
  return r.json();
}
// REST helper: throws on any failure, so nothing fails silently.
async function api(path,opts={}){
  const r=await fetch(`${SB_URL}/rest/v1/${path}`,{...opts,headers:{...H(),...(opts.headers||{})}});
  if(!r.ok){const t=await r.text();const e=new Error(t||('Error '+r.status));e.status=r.status;throw e}
  const txt=await r.text();return txt?JSON.parse(txt):null;
}
const post=(table,body,extra='')=>api(`${table}${extra}`,{method:'POST',headers:{'Prefer':'return=representation'},body:JSON.stringify(body)});
const patch=(table,filter,body)=>api(`${table}?${filter}`,{method:'PATCH',headers:{'Prefer':'return=representation'},body:JSON.stringify(body)});

function escapeHtml(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function nzParts(d=new Date()){const o={};new Intl.DateTimeFormat('en-CA',{timeZone:'Pacific/Auckland',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(d).forEach(p=>o[p.type]=p.value);return o}
function todayStr(){const o=nzParts();return`${o.year}-${o.month}-${o.day}`}
function nowMins(){const o=nzParts();return(+o.hour)*60+(+o.minute)}
function dowOf(ds){return new Date(ds+'T12:00:00Z').getUTCDay()}
function addToDate(ds,n,unit){const[y,m,d]=ds.split('-').map(Number);const dt=new Date(Date.UTC(y,m-1,d));if(unit==='day')dt.setUTCDate(dt.getUTCDate()+n);else if(unit==='week')dt.setUTCDate(dt.getUTCDate()+7*n);else dt.setUTCMonth(dt.getUTCMonth()+n);return dt.toISOString().slice(0,10)}
function hm(t){const[a,b]=String(t||'0:0').slice(0,5).split(':').map(Number);return(a||0)*60+(b||0)}
function fmt12(t){if(!t)return'';const[h,m]=String(t).slice(0,5).split(':').map(Number);return`${h%12||12}:${String(m).padStart(2,'0')}${h>=12?'pm':'am'}`}
function fmtDate(ds){if(!ds)return'';return new Date(ds+'T12:00:00Z').toLocaleDateString('en-NZ',{weekday:'short',day:'numeric',month:'short',timeZone:'UTC'})}
function fmtDT(iso){if(!iso)return'';return new Date(iso).toLocaleString('en-NZ',{timeZone:'Pacific/Auckland',weekday:'short',day:'numeric',month:'short',hour:'numeric',minute:'2-digit'})}
function fmtTime(iso){if(!iso)return'';return new Date(iso).toLocaleTimeString('en-NZ',{timeZone:'Pacific/Auckland',hour:'numeric',minute:'2-digit'})}
function mins(a,b){if(!a||!b)return null;return Math.max(0,Math.round((new Date(b)-new Date(a))/60000))}

const TRIGGER_LABELS={after_booking:'After every game in this room',before_first_booking:'Before the first game of the day in this room',open_days:'Every open day',schedule:'Repeats on a schedule',once:'Once',on_demand:'Only when someone starts it'};

const TYPE_LABELS={tick:'Tick box',okno:'OK / Not OK',dropdown:'Dropdown',number:'Number (e.g. battery %)',text:'Note',photo:'Photo',heading:'Heading (just text)'};

let tokenRefreshTimer=null;
function scheduleTokenRefresh(){clearTimeout(tokenRefreshTimer);if(!currentUser||!currentUser.expiresAt)return;tokenRefreshTimer=setTimeout(refreshAuthToken,Math.max(5000,currentUser.expiresAt-Date.now()-120000))}
async function refreshAuthToken(){
  if(!currentUser||!currentUser.refreshToken)return;
  try{
    const r=await fetch(`${SB_AUTH}/token?grant_type=refresh_token`,{method:'POST',headers:{'Content-Type':'application/json','apikey':SB_ANON},body:JSON.stringify({refresh_token:currentUser.refreshToken})});
    const data=await r.json();if(!r.ok||!data.access_token)throw new Error(data.error_description||'Refresh failed');
    currentUser.token=data.access_token;currentUser.refreshToken=data.refresh_token||currentUser.refreshToken;currentUser.expiresAt=Date.now()+((data.expires_in||3600)*1000);
    localStorage.setItem('btb_staff_session',JSON.stringify(currentUser));scheduleTokenRefresh();
  }catch(e){console.error('Token refresh failed — signing out:',e);doLogout()}
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&currentUser){if((currentUser.expiresAt||0)-Date.now()<5*60000)refreshAuthToken();if(activeTab==='today'&&!document.getElementById('overlay').classList.contains('show'))refreshToday()}});
async function doLogin(){
  let email=document.getElementById('loginEmail').value.trim().toLowerCase();if(email&&!email.includes('@'))email+='@btbescaperooms.co.nz';
  const pass=document.getElementById('loginPass').value;const errEl=document.getElementById('loginError');errEl.textContent='';
  if(!email||!pass){errEl.textContent='Please enter email and password.';return}
  try{
    const r=await fetch(`${SB_AUTH}/token?grant_type=password`,{method:'POST',headers:{'Content-Type':'application/json','apikey':SB_ANON},body:JSON.stringify({email,password:pass})});
    const data=await r.json();if(!r.ok){errEl.textContent=data.error_description||'Login failed.';return}
    const userId=data.user.id,token=data.access_token;
    const userRole=await callEdgeFunction('get_my_role',{},token).catch(()=>null)||{name:email.split('@')[0],role:'gamemaster_own'};
    let staffId=userId;
    try{const sr=await fetch(`${SB_URL}/rest/v1/staff?user_role_id=eq.${userId}&active=eq.true&select=id`,{headers:H(token)});const rows=await sr.json();if(rows[0])staffId=rows[0].id}catch(e){}
    currentUser={id:userId,staffId,email,token,refreshToken:data.refresh_token,expiresAt:Date.now()+((data.expires_in||3600)*1000),name:userRole.name,role:userRole.role};

    scheduleTokenRefresh();await startApp();

async function loadBookingsToday(){

function isOpenDay(){
  const oh=openingHours.find(o=>o.day===dowOf(todayStr()));

// Creates today's due checklists from each template's "when" setting. Safe to run on every load:
// the database refuses duplicates, which are simply ignored.
async function ensureRuns(){
  const today=todayStr(),now=nowMins();
  const active=templates.filter(t=>t.active&&itemsOf(t.id).length);
  if(!active.length)return;
  const ids=active.map(t=>t.id).join(',');
  const recent=await api(`cl_runs?template_id=in.(${ids})&select=id,template_id,booking_id,run_date,status,auto&order=run_date.desc&limit=2000`);
  const todo=[];
  const runBase=(t,extra={})=>({template_id:t.id,template_name:t.name,kind:t.kind,owners_only:t.kind==='owners',area_id:t.area_id,game_id:areas.find(a=>a.id===t.area_id)?.game_id||null,
    run_date:today,auto:true,assigned_staff_id:t.assign_mode==='staff'?t.assign_staff_id:null,assigned_role:t.assign_mode==='role'?t.assign_role:null,created_by:me(),...extra});
  for(const t of active){
    const mine=recent.filter(r=>r.template_id===t.id);
    const gid=areas.find(a=>a.id===t.area_id)?.game_id;
    if(t.trigger==='open_days'){
      if(isOpenDay()&&!mine.some(r=>r.run_date===today&&!r.booking_id&&r.auto))todo.push(runBase(t));
    }else if(t.trigger==='schedule'){
      const last=mine.find(r=>!r.booking_id);
      if(last&&last.status!=='done'&&last.status!=='skipped')continue; // still waiting to be done
      const next=last?addToDate(last.run_date,t.schedule_every||1,t.schedule_unit||'month'):(t.schedule_start||today);
      if(next<=today&&!mine.some(r=>r.run_date===today&&r.auto))todo.push(runBase(t));
    }else if(t.trigger==='once'){
      if(!mine.length)todo.push(runBase(t,{run_date:t.due_date||today}));
    }else if(t.trigger==='before_first_booking'&&gid){
      if(bookingsToday.some(b=>b.game_id===gid)&&!mine.some(r=>r.run_date===today&&r.auto&&!r.booking_id))todo.push(runBase(t));
    }else if(t.trigger==='after_booking'&&gid){
      bookingsToday.filter(b=>b.game_id===gid).forEach(b=>{
        const finished=b.status==='completed'||hm(b.slot_time)+gameLen(gid)<=now;
        if(finished&&!mine.some(r=>r.booking_id===b.id))todo.push(runBase(t,{booking_id:b.id}));
      });
    }
  }
  for(const body of todo){
    try{await post('cl_runs',body)}catch(e){if(e.status!==409)console.error('Create run:',e)}
  }
}
async function loadRuns(){
  const d=todayStr();
  runs=await api(`cl_runs?or=(run_date.eq.${d},status.in.(todo,in_progress))&select=*&order=run_date,created_at`)||[];
}

function runIsForMe(r){
  if(r.assigned_staff_id)return r.assigned_staff_id===me();
  if(r.assigned_role)return r.assigned_role===currentUser.role;
  return true;
}
function bookingOf(r){return bookingsToday.find(b=>b.id===r.booking_id)}
function jobHtml(r){
  const overdue=r.run_date<todayStr()&&r.status!=='done';
  const b=bookingOf(r);
  const who=r.assigned_staff_id?staffName(r.assigned_staff_id):r.assigned_role?(ROLE_LABELS[r.assigned_role]||r.assigned_role):'Anyone';
  const bits=[areaName(r.area_id),b?`after ${fmt12(b.slot_time)} game`:'',who,overdue?`<span style="color:var(--red);font-weight:700">Overdue since ${fmtDate(r.run_date)}</span>`:'',r.status==='in_progress'?'<span class="badge b-amber">Started</span>':''].filter(Boolean);
  return`<div class="job ${overdue?'overdue':''}" onclick="openRun('${r.id}')">
    <div class="job-icon"><i class="ti ${KIND_ICONS[r.kind]||'ti-checklist'}"></i></div>
    <div class="job-body"><div class="job-name">${escapeHtml(r.template_name)}</div><div class="job-meta">${bits.join(' · ')}</div></div>
    <i class="ti ti-chevron-right" style="color:var(--muted)"></i></div>`;
}
function renderRoomBoard(){
  const now=nowMins();
  const rooms=areas.filter(a=>a.active&&a.game_id&&(templates.some(t=>t.active&&t.area_id===a.id&&(t.kind==='reset'||t.kind==='setup'))||bookingsToday.some(b=>b.game_id===a.game_id)));
  if(!rooms.length)return'';
  const cards=rooms.map(a=>{
    const gb=bookingsToday.filter(b=>b.game_id===a.game_id);
    const next=gb.find(b=>hm(b.slot_time)>now);
    const rr=runs.filter(r=>r.game_id===a.game_id&&r.run_date===todayStr()&&r.kind==='reset');
    const pending=rr.filter(r=>r.status!=='done'&&r.status!=='skipped');
    const setup=runs.find(r=>r.game_id===a.game_id&&r.run_date===todayStr()&&r.kind==='setup'&&r.status!=='done');
    const lastDone=rr.filter(r=>r.status==='done').sort((x,y)=>String(y.completed_at).localeCompare(String(x.completed_at)))[0];
    const nextTxt=next?`Next game ${fmt12(next.slot_time)}`:(gb.length?'No more games today':'No games today');
    if(pending.length){
      const r=pending[0];const soon=next&&hm(next.slot_time)-now<=45;
      return`<div class="room-card need ${soon?'urgent':''}"><div class="room-name">${escapeHtml(a.name)}</div>
        <div class="room-status" style="color:var(--red)">⚠ NEEDS RESET</div><div class="room-sub" style="${soon?'color:var(--red);font-weight:700':''}">${nextTxt}</div>
        ${r.assigned_staff_id?`<div class="room-sub">Given to ${escapeHtml(staffName(r.assigned_staff_id))}</div>`:''}
        <div class="room-btns">${hasQuick(r.template_id)?`<button class="btn btn-green btn-sm" onclick="openRun('${r.id}','quick')">Quick reset</button>`:''}<button class="btn btn-primary btn-sm" onclick="openRun('${r.id}','full')">Full checklist</button><button class="btn btn-secondary btn-sm" onclick="handOver('${r.id}')">Give to…</button></div></div>`;
    }
    if(setup)return`<div class="room-card need"><div class="room-name">${escapeHtml(a.name)}</div><div class="room-status" style="color:var(--amber)">Set-up needed</div><div class="room-sub">${nextTxt}</div>
      <div class="room-btns"><button class="btn btn-primary btn-sm" onclick="openRun('${setup.id}')">Set up</button></div></div>`;
    return`<div class="room-card ${lastDone?'ready':''}"><div class="room-name">${escapeHtml(a.name)}</div>
      <div class="room-status" style="color:${lastDone?'var(--green)':'var(--muted)'}">${lastDone?'✓ Ready':'Ready'}</div>
      <div class="room-sub">${lastDone?`Reset by ${escapeHtml(staffName(lastDone.completed_by))} at ${fmtTime(lastDone.completed_at)}${lastDone.mode==='quick'?' (quick)':''}`:''}</div>
      <div class="room-sub">${nextTxt}</div></div>`;
  }).join('');
  return`<div class="section-title"><i class="ti ti-door"></i> Rooms</div><div class="room-grid">${cards}</div>`;
}
function hasQuick(tid){return itemsOf(tid).some(i=>i.in_quick)}
function renderToday(){
  const today=todayStr();
  const open=runs.filter(r=>r.status!=='done'&&r.status!=='skipped'&&r.run_date<=today&&r.kind!=='reset');
  const anyone=open.filter(r=>!r.assigned_staff_id&&(!r.assigned_role||r.assigned_role===currentUser.role));
  const mineList=open.filter(r=>r.assigned_staff_id===me()||(r.kind==='reset'&&false));
  const myResets=runs.filter(r=>r.kind==='reset'&&r.status!=='done'&&r.assigned_staff_id===me());
  const others=isAdmin()?open.filter(r=>r.assigned_staff_id&&r.assigned_staff_id!==me()):[];
  const roleOnly=open.filter(r=>r.assigned_role&&r.assigned_role!==currentUser.role&&isAdmin());
  const doneToday=runs.filter(r=>r.status==='done'&&r.run_date===today);
  const upcoming=runs.filter(r=>r.status!=='done'&&r.run_date>today&&runIsForMe(r));
  const myIssues=openIssues.filter(i=>i.assigned_staff_id===me());
  document.getElementById('content').innerHTML=`
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn btn-secondary btn-sm" onclick="refreshToday()"><i class="ti ti-refresh"></i> Refresh</button>
      <button class="btn btn-secondary btn-sm" onclick="startChecklistPicker()"><i class="ti ti-player-play"></i> Start a checklist</button>
      <button class="btn btn-danger btn-sm" onclick="openIssueForm()"><i class="ti ti-alert-triangle"></i> Report a problem</button>
    </div>
    ${renderRoomBoard()}
    <div class="section-title"><i class="ti ti-sun"></i> Today's jobs <span style="font-weight:400;text-transform:none;letter-spacing:0">— anyone can do these, they need doing today</span></div>
    ${anyone.length?anyone.map(jobHtml).join(''):'<div class="card empty-state">Nothing waiting 🎉</div>'}
    <div class="section-title"><i class="ti ti-user"></i> Given to you</div>
    ${(mineList.length||myResets.length||myIssues.length)?[...myResets,...mineList].map(jobHtml).join('')+myIssues.map(i=>`<div class="job" onclick="switchTab('issues')"><div class="job-icon" style="background:#fee2e2;color:#b91c1c"><i class="ti ti-tool"></i></div><div class="job-body"><div class="job-name">${escapeHtml(i.title)}</div><div class="job-meta">Issue · ${escapeHtml(areaName(i.area_id))}</div></div></div>`).join(''):'<div class="card empty-state">Nothing given to you right now</div>'}
    ${(others.length||roleOnly.length)?`<div class="section-title"><i class="ti ti-users"></i> Given to others</div>${[...others,...roleOnly].map(jobHtml).join('')}`:''}
    ${upcoming.length?`<div class="section-title"><i class="ti ti-calendar"></i> Coming up</div>${upcoming.map(jobHtml).join('')}`:''}
    ${doneToday.length?`<div class="section-title"><i class="ti ti-circle-check"></i> Done today (${doneToday.length})</div>${doneToday.map(r=>`<div class="job" onclick="openRecord('${r.id}')"><div class="job-icon" style="background:#dcfce7;color:#15803d"><i class="ti ti-check"></i></div><div class="job-body"><div class="job-name">${escapeHtml(r.template_name)}</div><div class="job-meta">${escapeHtml(areaName(r.area_id))} · ${escapeHtml(staffName(r.completed_by))} at ${fmtTime(r.completed_at)}${r.mode==='quick'?' · quick':''}</div></div></div>`).join('')}`:''}`;
}

// Start any active checklist by hand (e.g. a spot check, or one that only runs when started)
function startChecklistPicker(){
  const list=templates.filter(t=>t.active&&itemsOf(t.id).length).sort((a,b)=>(KIND_LABELS[a.kind]||'').localeCompare(KIND_LABELS[b.kind]||'')||a.name.localeCompare(b.name));
  showOverlay('Start a checklist',list.length?list.map(t=>`<div class="job" onclick="startManualRun('${t.id}')"><div class="job-icon"><i class="ti ${KIND_ICONS[t.kind]}"></i></div><div class="job-body"><div class="job-name">${escapeHtml(t.name)}</div><div class="job-meta">${KIND_LABELS[t.kind]}${t.area_id?' · '+escapeHtml(areaName(t.area_id)):''}</div></div></div>`).join(''):'<div class="empty-state">No checklists yet.</div>');
}
async function startManualRun(tid){
  const t=templates.find(x=>x.id===tid);if(!t)return;
  try{
    const rows=await post('cl_runs',{template_id:t.id,template_name:t.name,kind:t.kind,owners_only:t.kind==='owners',area_id:t.area_id,game_id:areas.find(a=>a.id===t.area_id)?.game_id||null,run_date:todayStr(),auto:false,assigned_staff_id:me(),created_by:me()});
    runs.push(rows[0]);openRun(rows[0].id);
  }catch(e){alert('Could not start it: '+e.message)}
}
async function handOver(runId){
  const opts=['<option value="">Anyone (goes on Today\'s jobs)</option>',...staffList.map(s=>`<option value="${s.id}">${escapeHtml(s.name)}</option>`)].join('');
  showOverlay('Give this to someone',`<div class="card"><div class="form-row"><label class="form-label">Who should do it?</label><select class="form-select" id="handTo">${opts}</select></div>
    <button class="btn btn-primary btn-big" onclick="confirmHandOver('${runId}')">Give it to them</button><div class="msg" id="handMsg"></div></div>`);
}
async function confirmHandOver(runId){
  const to=document.getElementById('handTo').value||null;
  try{await patch('cl_runs',`id=eq.${runId}`,{assigned_staff_id:to,assigned_role:null});closeOverlay();await refreshToday()}
  catch(e){const m=document.getElementById('handMsg');m.className='msg err';m.textContent='Not saved: '+e.message}
}

let cur=null; // {run, template, items, answers:{itemId:answer}, mode}
function showOverlay(title,html,foot){
  document.getElementById('overlayTitle').textContent=title;document.getElementById('overlayBody').innerHTML=html;
  document.getElementById('overlay').classList.add('show');document.body.style.overflow='hidden';
  const f=document.getElementById('runFoot');if(foot){document.getElementById('runFootInner').innerHTML=foot;f.classList.add('show')}else f.classList.remove('show');
  document.getElementById('overlay').scrollTop=0;
}
function closeOverlay(){document.getElementById('overlay').classList.remove('show');document.getElementById('runFoot').classList.remove('show');document.body.style.overflow='';cur=null;if(activeTab==='today')refreshToday()}
async function openRun(runId,mode){
  try{
    let run=runs.find(r=>r.id===runId);
    if(!run){const rows=await api(`cl_runs?id=eq.${runId}&select=*`);run=rows&&rows[0]}
    if(!run){alert('That checklist could not be found.');return}
    if(run.status==='done'){openRecord(runId);return}
    const template=templates.find(t=>t.id===run.template_id);
    const ans=await api(`cl_answers?run_id=eq.${runId}&select=*`);
    const answers={};(ans||[]).forEach(a=>answers[a.item_id]=a);
    const its=itemsOf(run.template_id);
    cur={run,template,items:its,answers,mode:mode||run.mode||null};
    const quickPossible=its.some(i=>i.in_quick);
    if(!cur.mode&&quickPossible&&(run.kind==='reset'||run.kind==='setup')){renderModeChoice();return}
    if(!cur.mode)cur.mode='full';
    if(run.status==='todo'||run.mode!==cur.mode){
      const upd={status:'in_progress',mode:cur.mode};
      if(run.status==='todo'){upd.started_by=me();upd.started_at=new Date().toISOString()}
      const rows=await patch('cl_runs',`id=eq.${run.id}`,upd);cur.run=rows[0];
      const i=runs.findIndex(r=>r.id===run.id);if(i>-1)runs[i]=cur.run;
    }
    renderRun();
  }catch(e){alert('Could not open the checklist: '+e.message);console.error(e)}
}
function renderModeChoice(){

function answerValue(itemId){return cur.answers[itemId]?.value??null}
// Items shown right now: the mode's items, plus follow-ups whose trigger answer has been given.
function visibleItems(){
  const top=cur.items.filter(i=>!i.parent_item_id&&(cur.mode==='full'||i.in_quick));
  const out=[];
  top.forEach(i=>{out.push(i);cur.items.filter(c=>c.parent_item_id===i.id&&String(answerValue(i.id))===String(c.show_when)).forEach(c=>out.push(c))});

}
function isLow(item,ans){return item.item_type==='number'&&item.low_below!=null&&ans&&ans.number_value!=null&&Number(ans.number_value)<Number(item.low_below)}
function itemHtml(i){
  const a=cur.answers[i.id];const v=a?.value??'';

    ctl=`<button class="tick-btn" onclick="setAnswer('${i.id}','${v==='yes'?'':'yes'}')"><span class="tick-box ${v==='yes'?'on':''}">${v==='yes'?'✓':''}</span><span class="item-label">${escapeHtml(i.label)}${i.required?'<span class="req">*</span>':''}</span></button>`;
  }else{
    ctl=`<div class="item-label">${escapeHtml(i.label)}${i.required?'<span class="req">*</span>':''}</div>`;
    if(i.item_type==='okno')ctl+=`<div class="choice-row"><button class="choice ${v==='ok'?'on-ok':''}" onclick="setAnswer('${i.id}','ok')">OK</button><button class="choice ${v==='not_ok'?'on-bad':''}" onclick="setAnswer('${i.id}','not_ok')">Not OK</button></div>`;
    else if(i.item_type==='dropdown'){
      const opts=Array.isArray(i.options)?i.options:[];
      ctl+=opts.length<=4?`<div class="choice-row">${opts.map((o,k)=>`<button class="choice ${v===o?(String(i.raises_issue_when)===o?'on-bad':'on'):''}" onclick="setAnswer('${i.id}',decodeURIComponent('${encodeURIComponent(o)}'))">${escapeHtml(o)}</button>`).join('')}</div>`
        :`<select class="form-select" style="margin-top:8px" onchange="setAnswer('${i.id}',this.value)"><option value="">Choose…</option>${opts.map(o=>`<option ${v===o?'selected':''}>${escapeHtml(o)}</option>`).join('')}</select>`;
    }
    else if(i.item_type==='number')ctl+=`<div style="display:flex;align-items:center;gap:8px;margin-top:8px"><input class="form-input" style="max-width:140px;font-size:18px;font-weight:700" type="number" inputmode="decimal" value="${escapeHtml(a?.number_value??'')}" onchange="setNumber('${i.id}',this.value)"><span>${escapeHtml(i.unit||'')}</span></div>${isLow(i,a)?`<div class="warn-line">⚠ Below ${escapeHtml(i.low_below)}${escapeHtml(i.unit||'')} — replace/charge it. This will be reported as an issue.</div>`:i.low_below!=null?`<div class="item-help">Warns below ${escapeHtml(i.low_below)}${escapeHtml(i.unit||'')}</div>`:''}`;
    else if(i.item_type==='text')ctl+=`<textarea class="form-textarea" style="margin-top:8px" onchange="setAnswer('${i.id}',this.value.trim())">${escapeHtml(v)}</textarea>`;
    else if(i.item_type==='photo')ctl+=`<div style="margin-top:8px"><label class="btn btn-secondary btn-sm"><i class="ti ti-camera"></i> ${a?.photo_path?'Retake photo':'Take photo'}<input type="file" accept="image/*" capture="environment" style="display:none" onchange="setPhoto('${i.id}',this)"></label><div id="ph-${i.id}"></div></div>`;
  }
  return`<div class="item ${i.parent_item_id?'child':''}" id="it-${i.id}">${ctl}${i.help?`<div class="item-help">${escapeHtml(i.help)}</div>`:''}${i.ref_photo_path?`<img class="ref-photo" data-ref="${escapeHtml(i.ref_photo_path)}" alt="How it should look" onclick="window.open(this.src)">`:''}</div>`;
}
function renderRun(){
  const r=cur.run,b=bookingOf(r),vis=visibleItems();
  const head=`<div style="font-size:13px;color:var(--muted);margin-bottom:10px">${escapeHtml(areaName(r.area_id))}${b?` · after the ${fmt12(b.slot_time)} game`:''}${cur.mode==='quick'?' · <span class="badge b-green">QUICK RESET</span>':''}${cur.template?.description?`<div style="margin-top:4px;white-space:pre-wrap">${escapeHtml(cur.template.description)}</div>`:''}</div>`;
  const quickSwitch=cur.items.some(i=>i.in_quick)?`<div style="margin-bottom:10px">${cur.mode==='quick'?`<span class="btn btn-secondary btn-sm" onclick="openRun('${r.id}','full')">Show full checklist</span>`:`<span class="btn btn-secondary btn-sm" onclick="openRun('${r.id}','quick')">Switch to quick reset</span>`}</div>`:'';
  showOverlay(r.template_name,head+quickSwitch+vis.map(itemHtml).join('')+`<div class="card"><label class="form-label">Note (optional)</label><textarea class="form-textarea" id="runNote" onchange="saveRunNote(this.value)">${escapeHtml(r.note||'')}</textarea></div><div class="msg" id="runMsg"></div>`,

async function loadPhotos(){

async function saveAnswer(itemId,fields){
  const i=cur.items.find(x=>x.id===itemId);
  const body={run_id:cur.run.id,item_id:itemId,item_label:i.label,item_type:i.item_type,answered_by:me(),answered_at:new Date().toISOString(),...fields};
  const rows=await api('cl_answers?on_conflict=run_id,item_id',{method:'POST',headers:{'Prefer':'resolution=merge-duplicates,return=representation'},body:JSON.stringify(body)});
  cur.answers[itemId]=rows[0];

async function setAnswer(itemId,value){
  try{await saveAnswer(itemId,{value:value===''?null:value});renderRun()}
  catch(e){alert('That answer was not saved: '+e.message)}
}
async function setNumber(itemId,raw){
  const n=raw===''?null:Number(raw);
  try{await saveAnswer(itemId,{value:raw===''?null:String(n),number_value:n});renderRun()}
  catch(e){alert('That reading was not saved: '+e.message)}
}
async function setPhoto(itemId,input){
  const f=input.files[0];if(!f)return;
  const box=document.getElementById('ph-'+itemId);if(box)box.innerHTML='<div class="item-help">Uploading…</div>';
  try{
    const path=await uploadPhoto(f,`cl/${cur.run.id}/${itemId}-${Date.now()}.jpg`);
    await saveAnswer(itemId,{value:'photo',photo_path:path});renderRun();
  }catch(e){if(box)box.innerHTML='';alert('Photo not saved: '+e.message)}

async function saveRunNote(v){
  try{const rows=await patch('cl_runs',`id=eq.${cur.run.id}`,{note:v.trim()||null});cur.run=rows[0]}catch(e){alert('Note not saved: '+e.message)}
}
function answered(i){const a=cur.answers[i.id];if(!a)return false;if(i.item_type==='photo')return!!a.photo_path;if(i.item_type==='number')return a.number_value!=null;return a.value!=null&&a.value!==''}
function flaggedItem(i){
  const a=cur.answers[i.id];if(!a)return false;
  if(i.item_type==='okno'&&a.value==='not_ok')return true;
  if(i.raises_issue_when&&String(a.value)===String(i.raises_issue_when))return true;
  return isLow(i,a);
}
async function completeRun(){
  const msg=document.getElementById('runMsg');
  const vis=visibleItems();
  const missing=vis.filter(i=>i.required&&!answered(i));
  if(missing.length){msg.className='msg err';msg.textContent='Still to do: '+missing.map(i=>i.label).join(', ');document.getElementById('it-'+missing[0].id)?.scrollIntoView({behavior:'smooth',block:'center'});return}
  msg.className='msg';msg.textContent='Saving…';
  try{
    // Raise an issue for each Not OK / "maintenance needed" / low reading, using its follow-up answers as the details
    for(const i of vis.filter(x=>!x.parent_item_id&&flaggedItem(x))){
      const kids=cur.items.filter(c=>c.parent_item_id===i.id&&String(answerValue(i.id))===String(c.show_when));
      const desc=kids.filter(c=>c.item_type==='text').map(c=>answerValue(c.id)).filter(Boolean).join('\n');
      const photo=kids.map(c=>cur.answers[c.id]?.photo_path).find(Boolean)||null;
      const a=cur.answers[i.id];
      const title=i.item_type==='number'?`${i.label}: ${a.number_value}${i.unit||''} (low)`:(desc?desc.split('\n')[0].slice(0,90):i.label);
      const what=i.item_type==='number'?`Reading ${a.number_value}${i.unit||''} — warns below ${i.low_below}${i.unit||''}`:`${i.label}: ${a.value==='not_ok'?'Not OK':a.value}`;
      await post('cl_issues',{title,description:desc||what,area_id:cur.run.area_id,game_id:cur.run.game_id,photo_path:photo,source_run_id:cur.run.id,source_item_id:i.id,reported_by:me()});
      await patch('cl_answers',`id=eq.${a.id}`,{flagged:true});
    }
    await patch('cl_runs',`id=eq.${cur.run.id}`,{status:'done',completed_by:me(),completed_at:new Date().toISOString(),mode:cur.mode});
    closeOverlay();
  }catch(e){msg.className='msg err';msg.textContent='Not saved: '+e.message}
}

function compressImage(file,maxDim,quality){
  return new Promise((resolve,reject)=>{
    const img=new Image(),reader=new FileReader();
    reader.onload=e=>{img.src=e.target.result};reader.onerror=reject;
    img.onload=()=>{let w=img.width,h=img.height;if(w>h&&w>maxDim){h=Math.round(h*maxDim/w);w=maxDim}else if(h>maxDim){w=Math.round(w*maxDim/h);h=maxDim}
      const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);c.toBlob(b=>resolve(b),'image/jpeg',quality)};
    img.onerror=reject;reader.readAsDataURL(file);
  });
}
async function uploadPhoto(file,path){
  const blob=await compressImage(file,1600,0.75);
  const r=await fetch(`${SB_URL}/storage/v1/object/task-photos/${path}`,{method:'POST',headers:{'Authorization':`Bearer ${currentUser.token}`,'apikey':SB_ANON,'Content-Type':'image/jpeg'},body:blob});
  if(!r.ok){const e=await r.json().catch(()=>({}));throw new Error(e.message||'Photo upload failed')}
  return path;
}
const signedCache={};
async function signedUrl(path){
  if(!path)return null;if(signedCache[path])return signedCache[path];
  try{const r=await fetch(`${SB_URL}/storage/v1/object/sign/task-photos/${path}`,{method:'POST',headers:H(),body:JSON.stringify({expiresIn:3600})});const d=await r.json();
    const u=d.signedURL?`${SB_URL}/storage/v1${d.signedURL}`:null;if(u)signedCache[path]=u;return u}catch(e){return null}
}

function renderTemplates(){

  const groups={};templates.forEach(t=>(groups[t.kind]=groups[t.kind]||[]).push(t));
  document.getElementById('content').innerHTML=`<button class="btn btn-primary" onclick="editTemplate(null)"><i class="ti ti-plus"></i> New checklist</button>`+
    Object.keys(KIND_LABELS).filter(k=>groups[k]).map(k=>`<div class="section-title"><i class="ti ${KIND_ICONS[k]}"></i> ${KIND_LABELS[k]}</div>`+groups[k].map(t=>`
      <div class="list-row" style="cursor:pointer;${t.active?'':'opacity:.55'}" onclick="editTemplate('${t.id}')"><div class="grow"><div style="font-weight:600">${escapeHtml(t.name)}${t.active?'':' (off)'}</div>
      <div class="item-help">${escapeHtml(areaName(t.area_id)||'No area')} · ${triggerText(t)} · ${itemsOf(t.id).length} items${hasQuick(t.id)?' · has quick reset':''} · ${t.assign_mode==='staff'?escapeHtml(staffName(t.assign_staff_id)):t.assign_mode==='role'?(ROLE_LABELS[t.assign_role]||t.assign_role):'Anyone'}</div></div><i class="ti ti-pencil"></i></div>`).join('')).join('');

function triggerText(t){
  if(t.trigger==='schedule')return`Every ${t.schedule_every||1} ${t.schedule_unit||'month'}${(t.schedule_every||1)>1?'s':''}`;
  if(t.trigger==='once')return t.due_date?`Once, by ${fmtDate(t.due_date)}`:'Once';
  return TRIGGER_LABELS[t.trigger]||t.trigger;
}
let ed=null,edSeq=0; // {t:{...}, items:[{key,id,parentKey,...}]}
function editTemplate(id){
  const t=id?{...templates.find(x=>x.id===id)}:{name:'',kind:'reset',area_id:'',assign_mode:'anyone',assign_role:'',assign_staff_id:'',trigger:'after_booking',schedule_every:1,schedule_unit:'month',schedule_start:todayStr(),due_date:'',description:'',active:true};
  const its=id?itemsOf(id):[];
  const keyOf={};its.forEach(i=>keyOf[i.id]='k'+(++edSeq));
  ed={t,items:its.map(i=>({...i,key:keyOf[i.id],parentKey:i.parent_item_id?keyOf[i.parent_item_id]:null,options:Array.isArray(i.options)?i.options:[]}))};
  // keep each follow-up right after its parent
  const tops=ed.items.filter(i=>!i.parentKey);ed.items=tops.flatMap(p=>[p,...ed.items.filter(c=>c.parentKey===p.key)]);
  renderEditor();
}
function edAnswersFor(p){if(p.item_type==='okno')return[['ok','OK'],['not_ok','Not OK']];if(p.item_type==='dropdown')return p.options.map(o=>[o,o]);if(p.item_type==='tick')return[['yes','Ticked']];return[]}
function edItemHtml(it,idx){

  const sel=(name,val,opts)=>`<select class="form-select" onchange="edSet('${it.key}','${name}',this.value)">${opts.map(([v,l])=>`<option value="${escapeHtml(v)}" ${String(val??'')===String(v)?'selected':''}>${escapeHtml(l)}</option>`).join('')}</select>`;

    ${parent?`<div class="row2" style="margin-bottom:6px"><div><label class="form-label">Follow-up — show when "${escapeHtml(parent.label||'…')}" is</label>${sel('show_when',it.show_when,edAnswersFor(parent))}</div></div>`:''}
    <div class="row2"><div style="flex:2"><label class="form-label">Question / item</label><input class="form-input" value="${escapeHtml(it.label)}" onchange="edSet('${it.key}','label',this.value)"></div>
      <div><label class="form-label">Type</label>${sel('item_type',it.item_type,Object.entries(TYPE_LABELS))}</div></div>
    ${it.item_type==='dropdown'?`<div class="form-row" style="margin-top:6px"><label class="form-label">Choices (separate with commas)</label><input class="form-input" value="${escapeHtml(it.options.join(', '))}" onchange="edSet('${it.key}','options',this.value)"></div>`:''}
    ${it.item_type==='number'?`<div class="row2" style="margin-top:6px"><div><label class="form-label">Unit (e.g. %, V)</label><input class="form-input" value="${escapeHtml(it.unit||'')}" onchange="edSet('${it.key}','unit',this.value)"></div><div><label class="form-label">Warn + raise issue if below</label><input class="form-input" type="number" value="${escapeHtml(it.low_below??'')}" onchange="edSet('${it.key}','low_below',this.value)"></div></div>`:''}
    ${it.item_type==='okno'?`<label class="chk" style="margin-top:6px"><input type="checkbox" ${it.raises_issue_when==='not_ok'?'checked':''} onchange="edSet('${it.key}','raises_issue_when',this.checked?'not_ok':'')"> "Not OK" raises an issue</label>`:''}
    ${it.item_type==='dropdown'?`<div class="form-row" style="margin-top:6px"><label class="form-label">Raise an issue when the answer is</label>${sel('raises_issue_when',it.raises_issue_when||'',[['','Never'],...it.options.map(o=>[o,o])])}</div>`:''}
    ${it.item_type!=='heading'?`<div class="form-row" style="margin-top:6px"><label class="form-label">Instructions (optional)</label><input class="form-input" value="${escapeHtml(it.help||'')}" onchange="edSet('${it.key}','help',this.value)"></div>`:''}
    <div class="ed-tools">
      ${it.item_type!=='heading'?`<label class="chk"><input type="checkbox" ${it.required?'checked':''} onchange="edSet('${it.key}','required',this.checked)"> Must answer</label>`:''}
      ${!parent?`<label class="chk"><input type="checkbox" ${it.in_quick?'checked':''} onchange="edSet('${it.key}','in_quick',this.checked)"> In quick reset</label>`:''}
      <label class="btn btn-secondary btn-sm"><i class="ti ti-photo"></i> ${it.ref_photo_path?'Change':'Add'} "how it should look" photo<input type="file" accept="image/*" style="display:none" onchange="edRefPhoto('${it.key}',this)"></label>
      ${it.ref_photo_path?`<span class="btn btn-secondary btn-sm" onclick="edSet('${it.key}','ref_photo_path','')">Remove photo</span>`:''}
      <span style="flex:1"></span>
      <span class="btn btn-secondary btn-sm" onclick="edMove('${it.key}',-1)">↑</span><span class="btn btn-secondary btn-sm" onclick="edMove('${it.key}',1)">↓</span>
      ${!parent&&['okno','dropdown','tick'].includes(it.item_type)?`<span class="btn btn-secondary btn-sm" onclick="edAdd('${it.key}')">+ Follow-up</span>`:''}
      <span class="btn btn-danger btn-sm" onclick="edRemove('${it.key}')">✕</span></div></div>`;
}

    <div id="edOnce" style="display:${t.trigger==='once'?'block':'none'}">${f('Due by (optional)',`<input class="form-input" type="date" id="edDue" value="${escapeHtml(t.due_date||'')}">`)}</div>
    ${f('Description / notes (optional)',`<textarea class="form-textarea" id="edDesc">${escapeHtml(t.description||'')}</textarea>`)}

  loadPhotos();

function edCaptureHeader(){
  const t=ed.t,g=id=>document.getElementById(id);if(!g('edName'))return;
  t.name=g('edName').value;t.kind=g('edKind').value;t.area_id=g('edArea').value;t.trigger=g('edTrigger').value;t.description=g('edDesc').value;t.active=g('edActive').checked;
  const w=g('edWho').value;t.assign_mode=w.startsWith('s:')?'staff':w.startsWith('r:')?'role':'anyone';t.assign_staff_id=w.startsWith('s:')?w.slice(2):'';t.assign_role=w.startsWith('r:')?w.slice(2):'';
  t.schedule_every=parseInt(g('edEvery').value)||1;t.schedule_unit=g('edUnit').value;t.schedule_start=g('edStart').value;t.due_date=g('edDue').value;
}
function edWhoChange(){}
function edTriggerChange(){const v=document.getElementById('edTrigger').value;document.getElementById('edSched').style.display=v==='schedule'?'flex':'none';document.getElementById('edOnce').style.display=v==='once'?'block':'none'}
function edSet(key,field,val){
  edCaptureHeader();const it=ed.items.find(i=>i.key===key);if(!it)return;
  if(field==='options')it.options=val.split(',').map(s=>s.trim()).filter(Boolean);
  else if(field==='low_below')it.low_below=val===''?null:Number(val);
  else it[field]=val;
  if(['item_type','options','ref_photo_path'].includes(field))renderEditor();
}
function edAdd(parentKey){
  edCaptureHeader();const n={key:'k'+(++edSeq),id:null,parentKey,label:'',item_type:parentKey?'text':'tick',options:[],required:!!parentKey,in_quick:false,low_below:null,unit:'',help:'',raises_issue_when:'',ref_photo_path:'',show_when:''};
  if(parentKey){const p=ed.items.find(i=>i.key===parentKey);n.show_when=(edAnswersFor(p)[p.item_type==='okno'?1:0]||[''])[0];n.in_quick=p.in_quick;
    let pos=ed.items.findIndex(i=>i.key===parentKey);while(ed.items[pos+1]&&ed.items[pos+1].parentKey===parentKey)pos++;ed.items.splice(pos+1,0,n)}
  else ed.items.push(n);
  renderEditor();
}
function edRemove(key){edCaptureHeader();ed.items=ed.items.filter(i=>i.key!==key&&i.parentKey!==key);renderEditor()}
function edMove(key,dir){
  edCaptureHeader();const it=ed.items.find(i=>i.key===key);
  if(it.parentKey){const sib=ed.items.filter(i=>i.parentKey===it.parentKey);const k=sib.indexOf(it),j=k+dir;if(j<0||j>=sib.length)return;
    const a=ed.items.indexOf(sib[k]),b=ed.items.indexOf(sib[j]);[ed.items[a],ed.items[b]]=[ed.items[b],ed.items[a]]}
  else{const tops=ed.items.filter(i=>!i.parentKey);const k=tops.indexOf(it),j=k+dir;if(j<0||j>=tops.length)return;[tops[k],tops[j]]=[tops[j],tops[k]];ed.items=tops.flatMap(p=>[p,...ed.items.filter(c=>c.parentKey===p.key)])}
  renderEditor();
}
async function edRefPhoto(key,input){
  const f=input.files[0];if(!f)return;edCaptureHeader();
  try{const path=await uploadPhoto(f,`ref/${Date.now()}.jpg`);edSet(key,'ref_photo_path',path)}catch(e){alert('Photo not saved: '+e.message)}
}
async function saveTemplate(){
  edCaptureHeader();const t=ed.t,m=document.getElementById('edMsg');
  if(!t.name.trim()){m.className='msg err';m.textContent='Please give it a name.';return}
  if(t.assign_mode==='staff'&&!t.assign_staff_id)t.assign_mode='anyone';
  const bad=ed.items.find(i=>!String(i.label).trim());if(bad){m.className='msg err';m.textContent='Every item needs a question / label.';return}
  const badDrop=ed.items.find(i=>i.item_type==='dropdown'&&i.options.length<2);if(badDrop){m.className='msg err';m.textContent=`"${badDrop.label}" needs at least 2 choices.`;return}
  m.className='msg';m.textContent='Saving…';
  const body={name:t.name.trim(),kind:t.kind,area_id:t.area_id||null,assign_mode:t.assign_mode,assign_role:t.assign_mode==='role'?t.assign_role:null,assign_staff_id:t.assign_mode==='staff'?t.assign_staff_id:null,
    trigger:t.trigger,schedule_every:t.trigger==='schedule'?t.schedule_every:null,schedule_unit:t.trigger==='schedule'?t.schedule_unit:null,schedule_start:t.trigger==='schedule'?(t.schedule_start||todayStr()):null,
    due_date:t.trigger==='once'?(t.due_date||null):null,description:t.description.trim()||null,active:t.active,updated_at:new Date().toISOString()};
  try{
    let tid=t.id;
    if(tid)await patch('cl_templates',`id=eq.${tid}`,body);else{body.created_by=me();tid=(await post('cl_templates',body))[0].id}
    // Items removed in the editor are switched off (not deleted) so old records keep their answers
    const keepIds=new Set(ed.items.filter(i=>i.id).map(i=>i.id));
    for(const old of itemsOf(tid))if(!keepIds.has(old.id))await patch('cl_items',`id=eq.${old.id}`,{active:false});
    const idOf={};let order=0;
    for(const pass of [false,true]){ // parents first, then follow-ups (they need the parent's id)
      for(const it of ed.items.filter(i=>!!i.parentKey===pass)){
        const b={template_id:tid,parent_item_id:pass?idOf[it.parentKey]:null,show_when:pass?(it.show_when||null):null,sort_order:++order,label:String(it.label).trim(),help:(it.help||'').trim()||null,item_type:it.item_type,
          options:it.item_type==='dropdown'?it.options:[],required:it.item_type==='heading'?false:!!it.required,in_quick:pass?!!ed.items.find(p=>p.key===it.parentKey)?.in_quick:!!it.in_quick,
          low_below:it.item_type==='number'?it.low_below:null,unit:it.item_type==='number'?(it.unit||null):null,raises_issue_when:['okno','dropdown'].includes(it.item_type)?(it.raises_issue_when||null):null,ref_photo_path:it.ref_photo_path||null,active:true};
        if(it.id){await patch('cl_items',`id=eq.${it.id}`,b);idOf[it.key]=it.id}else idOf[it.key]=(await post('cl_items',b))[0].id;
      }
    }
    templates=await api('cl_templates?select=*&order=sort_order,name');await loadItems();
    closeOverlay();switchTab('templates');
  }catch(e){m.className='msg err';m.textContent='Not saved: '+e.message}
}

async function saveArea(id,fields){

}
async function moveArea(k,dir){
  const j=k+dir;if(j<0||j>=areas.length)return;const a=areas[k],b=areas[j];
  try{await patch('cl_areas',`id=eq.${a.id}`,{sort_order:j});await patch('cl_areas',`id=eq.${b.id}`,{sort_order:k});
    for(let n=0;n<areas.length;n++)if(n!==k&&n!==j&&areas[n].sort_order!==n)await patch('cl_areas',`id=eq.${areas[n].id}`,{sort_order:n});
    areas=await api('cl_areas?select=*&order=sort_order,name');renderSettings()}catch(e){alert('Not saved: '+e.message)}
}
async function addArea(){
  const name=document.getElementById('newArea').value.trim(),m=document.getElementById('areaMsg');if(!name)return;
  try{await post('cl_areas',{name,sort_order:areas.length+1});areas=await api('cl_areas?select=*&order=sort_order,name');renderSettings()}catch(e){m.className='msg err';m.textContent='Not saved: '+e.message}
}

window.addEventListener('DOMContentLoaded',async()=>{
  const saved=localStorage.getItem('btb_staff_session');
  if(!saved)return;
  try{
    currentUser=JSON.parse(saved);
    if(!currentUser.refreshToken){doLogout();return}
    if((currentUser.expiresAt||0)-Date.now()<5*60*1000){await refreshAuthToken();if(!currentUser)return}
    scheduleTokenRefresh();await startApp();
  }catch(e){console.error('Session restore failed — signing out:',e);doLogout()}
});
setInterval(()=>{if(currentUser&&activeTab==='today'&&document.visibilityState==='visible'&&!document.getElementById('overlay').classList.contains('show'))refreshToday()},120000);
</script>
