<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" role="img" aria-label="Illustration of board game pieces: dice, meeples, cards and a game board">
  <defs>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0V60" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="380" fill="#20342b"/>
  <rect width="1200" height="380" fill="url(#grid)"/>

  <!-- game board (chequered) -->
  <g transform="translate(70 60) rotate(-8)" filter="url(#sh)">
    <rect width="250" height="250" rx="10" fill="#e8ddc7"/>
    <g fill="#c6a05b" fill-opacity="0.55">
      <rect x="15" y="15" width="44" height="44"/><rect x="103" y="15" width="44" height="44"/><rect x="191" y="15" width="44" height="44"/>
      <rect x="59" y="59" width="44" height="44"/><rect x="147" y="59" width="44" height="44"/>
      <rect x="15" y="103" width="44" height="44"/><rect x="103" y="103" width="44" height="44"/><rect x="191" y="103" width="44" height="44"/>
      <rect x="59" y="147" width="44" height="44"/><rect x="147" y="147" width="44" height="44"/>
      <rect x="15" y="191" width="44" height="44"/><rect x="103" y="191" width="44" height="44"/><rect x="191" y="191" width="44" height="44"/>
    </g>
    <rect x="15" y="15" width="220" height="220" fill="none" stroke="#24251f" stroke-opacity="0.35" stroke-width="2"/>
    <!-- pawns on board -->
    <circle cx="81" cy="81" r="15" fill="#c75539"/><circle cx="169" cy="169" r="15" fill="#07b4c5"/>
  </g>

  <!-- playing cards fan -->
  <g transform="translate(400 70)" filter="url(#sh)">
    <g transform="rotate(-16 70 220)">
      <rect width="140" height="200" rx="12" fill="#faf7f0"/><rect x="10" y="10" width="120" height="180" rx="8" fill="none" stroke="#c75539" stroke-width="3"/>
      <path d="M70 70c-18-24-48-6-30 20l30 32 30-32c18-26-12-44-30-20z" fill="#c75539"/>
    </g>
    <g transform="rotate(2 70 220) translate(40 -6)">
      <rect width="140" height="200" rx="12" fill="#faf7f0"/><rect x="10" y="10" width="120" height="180" rx="8" fill="none" stroke="#20342b" stroke-width="3"/>
      <path d="M70 52l30 48-30 48-30-48z" fill="#07b4c5"/>
    </g>
    <g transform="rotate(18 70 220) translate(80 0)">
      <rect width="140" height="200" rx="12" fill="#c6a05b"/><rect x="10" y="10" width="120" height="180" rx="8" fill="none" stroke="#faf7f0" stroke-opacity="0.7" stroke-width="3"/>
      <text x="70" y="118" text-anchor="middle" font-family="Georgia, serif" font-size="54" fill="#faf7f0">?</text>
    </g>
  </g>

  <!-- dice -->
  <g transform="translate(720 70) rotate(12)" filter="url(#sh)">
    <rect width="110" height="110" rx="20" fill="#faf7f0"/>
    <g fill="#24251f"><circle cx="28" cy="28" r="10"/><circle cx="82" cy="28" r="10"/><circle cx="55" cy="55" r="10"/><circle cx="28" cy="82" r="10"/><circle cx="82" cy="82" r="10"/></g>
  </g>
  <g transform="translate(800 210) rotate(-14)" filter="url(#sh)">
    <rect width="96" height="96" rx="18" fill="#c75539"/>
    <g fill="#faf7f0"><circle cx="26" cy="26" r="9"/><circle cx="70" cy="26" r="9"/><circle cx="26" cy="48" r="9"/><circle cx="70" cy="48" r="9"/><circle cx="26" cy="70" r="9"/><circle cx="70" cy="70" r="9"/></g>
  </g>

  <!-- meeples -->
  <g filter="url(#sh)">
    <path transform="translate(960 80)" d="M50 0c16 0 26 12 26 26 0 8-3 14-8 19l30 12c8 3 10 13 4 19-5 5-13 4-18 1l-10-6 16 52c2 8-4 15-12 15H64l-14-30-14 30H22c-8 0-14-7-12-15l16-52-10 6c-5 3-13 4-18-1-6-6-4-16 4-19l30-12c-5-5-8-11-8-19C24 12 34 0 50 0z" fill="#07b4c5"/>
    <path transform="translate(1040 190) scale(0.8)" d="M50 0c16 0 26 12 26 26 0 8-3 14-8 19l30 12c8 3 10 13 4 19-5 5-13 4-18 1l-10-6 16 52c2 8-4 15-12 15H64l-14-30-14 30H22c-8 0-14-7-12-15l16-52-10 6c-5 3-13 4-18-1-6-6-4-16 4-19l30-12c-5-5-8-11-8-19C24 12 34 0 50 0z" fill="#c6a05b"/>
    <path transform="translate(935 245) scale(0.62) rotate(-10)" d="M50 0c16 0 26 12 26 26 0 8-3 14-8 19l30 12c8 3 10 13 4 19-5 5-13 4-18 1l-10-6 16 52c2 8-4 15-12 15H64l-14-30-14 30H22c-8 0-14-7-12-15l16-52-10 6c-5 3-13 4-18-1-6-6-4-16 4-19l30-12c-5-5-8-11-8-19C24 12 34 0 50 0z" fill="#faf7f0"/>
  </g>

  <!-- small hex tile + token -->
  <g transform="translate(640 250)" filter="url(#sh)">
    <path d="M40 0l40 23v46L40 92 0 69V23z" fill="#879688"/>
    <circle cx="40" cy="46" r="16" fill="#e8ddc7"/>
  </g>
</svg>
