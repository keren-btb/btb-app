<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invoice details — Beyond the Box</title>
<link rel="icon" href="icon-32.png">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f0fafb;color:#111827}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 40px}
.brand{background:#1a1035;color:#fff;border-radius:14px;padding:16px 18px;margin-bottom:16px}
.brand h1{margin:0;font-size:20px;color:#07b4c5}
.brand p{margin:4px 0 0;font-size:13px;color:#c7d2fe}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:16px 18px;margin-bottom:14px}
.card h2{font-size:15px;margin:0 0 10px}
.sum div{font-size:14px;margin:3px 0}
label{display:block;font-size:12px;font-weight:700;color:#4b5563;text-transform:uppercase;letter-spacing:.3px;margin:12px 0 4px}
label small{text-transform:none;font-weight:400;color:#9ca3af;letter-spacing:0}
input,textarea,select{width:100%;font:15px Arial;border:1px solid #d1d5db;border-radius:9px;padding:10px 11px;background:#fff}
textarea{min-height:70px;resize:vertical}
input:focus,textarea:focus{outline:none;border-color:#07b4c5}
.opts label{display:flex;align-items:center;gap:8px;text-transform:none;font-weight:400;font-size:15px;color:#111827;letter-spacing:0;border:1px solid #d1d5db;border-radius:9px;padding:10px 12px;margin:6px 0;cursor:pointer;background:#fff}
.opts input{width:auto;margin:0;accent-color:#07b4c5}
button{width:100%;background:#07b4c5;color:#fff;border:none;border-radius:10px;padding:14px;font-size:16px;font-weight:700;cursor:pointer;margin-top:16px}
button:disabled{opacity:.6}
.msg{font-size:14px;margin-top:10px}
.err{color:#b91c1c}
.done{text-align:center;padding:30px 18px}
.done h2{color:#07b4c5}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><h1>🔑 Beyond the Box Escape Rooms</h1><p>Invoice details for your booking</p></div>
  <div id="app"><div class="card">Loading your booking…</div></div>
</div>
<script>
// invoice_request.html v1.0.0 — 2026-11-23: customer fills in who to invoice (opened from the booking confirmation
// email or the booking page). Needs the booking id + its private token from the link; talks only to btb-public.
const BUILD_VERSION='1.0.0';
const SB_URL='https://dcksohetvlonijtcbjwe.supabase.co';
const qp=new URLSearchParams(location.search),bookingId=qp.get('b'),token=qp.get('t');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'$'+(Number(n)||0).toFixed(2).replace(/\.00$/,'');
async function call(body){const r=await fetch(`${SB_URL}/functions/v1/btb-public`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json().catch(()=>({}));if(!r.ok||d.ok===false)throw new Error(d.message||'Something went wrong — please call us on 0220 537 365.');return d}
function fmtDate(d){return new Date(d+'T12:00').toLocaleDateString('en-NZ',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}
function fmtTime(t){const[h,m]=t.split(':').map(Number);return`${h%12||12}${m?':'+String(m).padStart(2,'0'):''}${h>=12?'pm':'am'}`}
let info=null;
async function init(){
  const app=document.getElementById('app');
  if(!bookingId||!token){app.innerHTML='<div class="card err">This link is incomplete — please use the link in your booking email, or call us on 0220 537 365.</div>';return}
  try{info=await call({action:'invoice_form',bookingId,token})}catch(e){app.innerHTML=`<div class="card err">${esc(e.message)}</div>`;return}
  const games=info.games.map(g=>`${esc(g.name)} — ${fmtTime(g.time)}${g.players?` · ${g.players} players`:''}`).join('<br>');
  const p=info.prefill||{};
  const suggested=`${info.games.map(g=>g.name).join(' + ')} — ${new Date(info.date+'T12:00').toLocaleDateString('en-NZ',{day:'numeric',month:'short',year:'numeric'})}`;
  app.innerHTML=`
  <div class="card sum"><h2>Your booking</h2><div><b>${fmtDate(info.date)}</b></div><div>${games}</div>
    <div style="margin-top:8px">Total <b>${money(info.total)}</b> · deposit ${money(info.depositDue)}${info.depositPaid?` (${money(info.depositPaid)} paid)`:''}</div></div>
  ${info.alreadySent?'<div class="card" style="background:#fef9c3;border-color:#fde68a;font-size:14px">We already have invoice details for this booking. Sending this form again will update them.</div>':''}
  <div class="card"><h2>Who should we invoice?</h2>
    <label>Company / organisation name *</label><input id="org" value="${esc(p.org_name||'')}" autocomplete="organization">
    <label>Contact person</label><input id="contact" value="${esc(p.contact_name||'')}" autocomplete="name">
    <label>Email to send the invoice to * <small>(e.g. your accounts team)</small></label><input id="email" type="email" value="${esc(p.email||'')}" autocomplete="email">
    <label>Phone</label><input id="phone" type="tel" value="${esc(p.phone||'')}" autocomplete="tel">
    <label>Purchase order / your reference <small>(if you have one)</small></label><input id="po">
    <label>What should the invoice say? <small>(e.g. Team building, Christmas do)</small></label><input id="narr" value="${esc(suggested)}">
    <label>What would you like invoiced?</label>
    <div class="opts">
      <label><input type="radio" name="what" value="deposit"> Just the deposit for now (${money(info.depositDue)})</label>
      <label><input type="radio" name="what" value="full_now" checked> The full amount now</label>
      <label><input type="radio" name="what" value="full_after"> The full amount after the event</label>
    </div>
    <label>Billing address <small>(if your accounts team needs it)</small></label><textarea id="addr" autocomplete="street-address"></textarea>
    <label>Payment terms you need <small>(optional — ours are 14 days)</small></label><input id="terms" placeholder="e.g. 20th of the following month">
    <label>Anything else?</label><textarea id="notes"></textarea>
    <button id="send" onclick="send()">Send invoice details</button><div class="msg" id="msg"></div>
  </div>`;
}
async function send(){
  const v=id=>document.getElementById(id).value.trim(),msg=document.getElementById('msg'),btn=document.getElementById('send');
  if(!v('org')){msg.className='msg err';msg.textContent='Please enter the name to invoice.';return}
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v('email'))){msg.className='msg err';msg.textContent='Please enter a valid email address for the invoice.';return}
  btn.disabled=true;msg.className='msg';msg.textContent='Sending…';
  try{
    await call({action:'invoice_request',bookingId,token,fields:{org_name:v('org'),contact_name:v('contact'),email:v('email'),phone:v('phone'),po_number:v('po'),narration:v('narr'),
      invoice_what:document.querySelector('input[name=what]:checked')?.value||'full_now',billing_address:v('addr'),terms_note:v('terms'),notes:v('notes')}});
    document.getElementById('app').innerHTML=`<div class="card done"><h2>Thank you!</h2><p>We've got your invoice details and will email the invoice to <b>${esc(v('email'))}</b>.</p><p style="font-size:13px;color:#6b7280">Questions? Call or text 0220 537 365.</p></div>`;
  }catch(e){btn.disabled=false;msg.className='msg err';msg.textContent=e.message}
}
init();
</script>
</body>
</html>
